<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DataBridge — Phase 4 · Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#eef0f2; --surface:#f8f9fa; --raised:#ffffff; --soft:#e3e6ea; --softer:#edeff2;
    --line:#d0d5da; --line-strong:#b8bec5;
    --ink:#0f1a22; --ink-2:#334049; --ink-3:#4a5660; --muted:#6b7680; --muted-2:#8891a0;
    --ocean:#164e63; --ocean-hover:#103d4f; --ocean-soft:#d0e1e6; --ocean-softer:#e8f0f3;
    --ai:#c08a5e; --ai-soft:#f1e4d6;
    --ok:#3f7a5c; --ok-soft:#dbe8e0; --warn:#a06a1c; --warn-soft:#f1e4c8; --err:#a43a3a; --err-soft:#f1d7d7;
    --c1:#164e63;--c2:#3f7a5c;--c3:#a06a1c;--c4:#6b4e8c;--c5:#8c5a3c;--c6:#2d6e78;
    --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-pill:999px;
    --e-1:0 1px 2px rgba(15,26,34,0.04);
    --e-2:0 1px 2px rgba(15,26,34,0.04),0 4px 12px -4px rgba(15,26,34,0.06);
    --e-3:0 1px 2px rgba(15,26,34,0.04),0 12px 40px -12px rgba(15,26,34,0.12);
    --ease:cubic-bezier(0.22,1,0.36,1);
    --f-d:"Source Serif 4",Georgia,serif;
    --f-b:Inter,system-ui,sans-serif;
    --f-m:"Geist Mono",ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--f-b);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";line-height:1.55;overflow:hidden}
  #app{height:100vh;display:flex;flex-direction:column}

  /* App frame */
  .chrome{height:48px;background:var(--raised);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
  .chrome .wm{font-family:var(--f-d);font-weight:500;font-size:17px;letter-spacing:-0.02em;color:var(--ink);display:flex;align-items:center;gap:9px}
  .chrome .wm svg{color:var(--ocean)}
  .chrome .workspace{font-family:var(--f-m);font-size:11px;color:var(--muted);letter-spacing:0.06em;padding:4px 10px;border-left:1px solid var(--line);margin-left:6px}
  .chrome .spacer{flex:1}
  .chrome .user{width:26px;height:26px;border-radius:50%;background:var(--ocean-softer);color:var(--ocean);font-family:var(--f-b);font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:0.02em}
  .chrome .bell{color:var(--muted);cursor:pointer;padding:6px;border-radius:var(--r-sm);position:relative}
  .chrome .bell:hover{background:var(--soft);color:var(--ink)}
  .chrome .bell .pip{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--ai)}

  .body{flex:1;display:flex;min-height:0}

  /* Rail */
  .rail{width:220px;background:var(--raised);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
  .rail .sec{font-family:var(--f-m);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
  .rail .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;cursor:pointer;transition:background 120ms var(--ease);user-select:none}
  .rail .item:hover{background:var(--soft)}
  .rail .item.active{background:var(--ocean-softer);color:var(--ocean);font-weight:500}
  .rail .item .r{display:flex;align-items:center;gap:10px}
  .rail .item .ico{width:14px;height:14px;color:currentColor;opacity:0.85}
  .rail .item .count{font-family:var(--f-m);font-size:10px;color:var(--muted)}
  .rail .item.active .count{color:var(--ocean)}
  .rail .item .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .rail .spacer{flex:1}
  .rail .kbd{font-family:var(--f-m);font-size:10px;color:var(--muted-2)}

  /* Main */
  .main{flex:1;overflow:auto;min-width:0}
  .main-inner{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .crumb{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:14px;font-family:var(--f-m);letter-spacing:0.04em}
  .crumb .sep{color:var(--line-strong)}
  .crumb .cur{color:var(--ink-2)}

  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:24px}
  .page-head h1{font-family:var(--f-d);font-weight:500;font-size:38px;letter-spacing:-0.025em;line-height:1.05;margin:0 0 8px}
  .page-head h1 em{font-style:italic;font-weight:400;color:var(--ink-2)}
  .page-head .lede{font-size:14px;color:var(--muted);margin:0;max-width:540px;line-height:1.55}
  .page-head .actions{display:flex;gap:10px;flex-shrink:0}

  /* Buttons */
  .btn{font-family:var(--f-b);font-weight:500;font-size:13.5px;padding:9px 16px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 120ms var(--ease);line-height:1;white-space:nowrap}
  .btn-primary{background:var(--ocean);color:#fff;border-color:var(--ocean)}
  .btn-primary:hover{background:var(--ocean-hover);border-color:var(--ocean-hover)}
  .btn-secondary{background:var(--raised);color:var(--ink);border-color:var(--line)}
  .btn-secondary:hover{border-color:var(--line-strong);background:var(--softer)}
  .btn-ghost{background:transparent;color:var(--ink-2)}
  .btn-ghost:hover{background:var(--soft);color:var(--ink)}
  .btn-sm{padding:6px 12px;font-size:12.5px}

  /* Badge */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-family:var(--f-m);font-size:10.5px;letter-spacing:0.04em;font-weight:500;text-transform:uppercase}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-err{background:var(--err-soft);color:var(--err)}
  .b-ocean{background:var(--ocean-soft);color:var(--ocean)}
  .b-neu{background:var(--soft);color:var(--ink-3)}
  .b-ai{background:var(--ai-soft);color:var(--ai)}
  .badge .pip{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* Label */
  .label{font-family:var(--f-m);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:500}

  /* Cards */
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md)}
  .card-pad{padding:22px}

  /* Tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{font-family:var(--f-b);font-size:13.5px;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 120ms;user-select:none}
  .tab.active{color:var(--ink);border-bottom-color:var(--ocean)}
  .tab:hover:not(.active){color:var(--ink-2)}

  /* =========== ASK SCREEN =========== */
  .ask-wrap{max-width:880px;margin:0 auto}
  .ask-hero{text-align:center;padding:40px 0 32px}
  .ask-hero h1{font-family:var(--f-d);font-weight:500;font-size:56px;letter-spacing:-0.03em;line-height:1;margin:0 0 14px}
  .ask-hero h1 em{font-style:italic;font-weight:400;color:var(--ink-2)}
  .ask-hero .sub{font-size:15px;color:var(--muted);margin:0}
  .ask-input-wrap{position:relative;margin-bottom:24px}
  .ask-input{width:100%;font-family:var(--f-d);font-size:22px;padding:22px 60px 22px 24px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--raised);color:var(--ink);outline:none;transition:all 160ms var(--ease);box-shadow:var(--e-1);letter-spacing:-0.01em;line-height:1.4}
  .ask-input::placeholder{color:var(--muted-2);font-style:italic}
  .ask-input:focus{border-color:var(--ocean);box-shadow:0 0 0 4px var(--ocean-soft),var(--e-1)}
  .ask-send{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--ocean);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 120ms}
  .ask-send:hover{background:var(--ocean-hover)}
  .ask-hints{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{font-family:var(--f-b);font-size:12.5px;padding:6px 12px;border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all 120ms}
  .chip:hover{border-color:var(--line-strong);color:var(--ink);background:var(--softer)}
  .chip .arr{color:var(--muted);font-size:10px;margin-right:4px}

  .ask-thread{margin-top:48px;display:flex;flex-direction:column;gap:28px}
  .ask-q{border-left:2px solid var(--line-strong);padding:4px 0 4px 20px}
  .ask-q .who{font-family:var(--f-m);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .ask-q .q{font-family:var(--f-d);font-size:22px;line-height:1.3;color:var(--ink);letter-spacing:-0.01em;margin:0}

  .ai-msg{background:var(--raised);border:1px solid var(--line);border-left:2px solid var(--ai);border-radius:var(--r-md);padding:22px 26px}
  .ai-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .ai-avatar{width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .ai-avatar .dot{width:4px;height:4px;border-radius:50%;background:var(--ai);display:inline-block;margin:0 1.5px}
  @keyframes shimmer{0%,100%{opacity:0.35}50%{opacity:1}}
  .shimmer .dot:nth-child(1){animation:shimmer 1.4s 0s infinite}
  .shimmer .dot:nth-child(2){animation:shimmer 1.4s 0.2s infinite}
  .shimmer .dot:nth-child(3){animation:shimmer 1.4s 0.4s infinite}
  .ai-body{font-family:var(--f-d);font-size:18px;line-height:1.5;color:var(--ink);margin:0}
  .ai-body em{font-style:italic;color:var(--ink)}
  .ai-body b{font-weight:600}
  .ai-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--softer);font-family:var(--f-m);font-size:10.5px;color:var(--muted);letter-spacing:0.06em;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .ai-foot a{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line-strong);cursor:pointer}
  .ai-foot a:hover{color:var(--ocean);text-decoration-color:var(--ocean)}

  .ai-chart{margin-top:18px;padding:18px;background:var(--surface);border-radius:var(--r-sm);border:1px solid var(--softer)}
  .ai-chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .ai-chart-head .t{font-family:var(--f-b);font-weight:600;font-size:13px}
  .ai-chart-head .s{font-family:var(--f-m);font-size:10.5px;color:var(--muted);letter-spacing:0.04em}

  /* =========== KPI + CHART CARDS =========== */
  .kpi{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:20px}
  .kpi .l{font-family:var(--f-m);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .kpi .n{font-family:var(--f-d);font-weight:500;font-size:38px;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .d{font-family:var(--f-m);font-size:11px;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
  .kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--err)}
  .kpi .s{font-family:var(--f-m);font-size:10px;letter-spacing:0.06em;color:var(--muted);margin-left:6px}
  .kpi .mini{height:34px;width:100%;display:block;margin-top:12px}

  .chart-card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:22px}
  .chart-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:16px}
  .chart-head h4{font-family:var(--f-b);font-weight:600;font-size:14px;margin:0;letter-spacing:-0.005em}
  .chart-head p{font-family:var(--f-m);font-size:10.5px;color:var(--muted);margin:4px 0 0;letter-spacing:0.04em}
  .chart-head .legend{display:flex;gap:14px;font-family:var(--f-m);font-size:10px;color:var(--muted);letter-spacing:0.04em;flex-wrap:wrap}
  .chart-head .legend .dd{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
  .chart-head .menu{color:var(--muted-2);cursor:pointer;padding:2px 6px;border-radius:4px}
  .chart-head .menu:hover{background:var(--soft);color:var(--ink)}

  /* Table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl thead th{font-family:var(--f-m);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:500;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);background:var(--softer)}
  .tbl tbody td{padding:13px 16px;border-bottom:1px solid var(--softer);color:var(--ink-2)}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer;transition:background 100ms}
  .tbl tbody tr:hover{background:var(--softer)}
  .tbl .mono{font-family:var(--f-m);font-size:12.5px;color:var(--ink)}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-m);font-size:12.5px}

  /* =========== PRODUCTS / STAR SCHEMA =========== */
  .schema-canvas{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);position:relative;min-height:540px;overflow:hidden;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
  .node{position:absolute;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--e-1);min-width:180px;transition:all 160ms var(--ease)}
  .node:hover{border-color:var(--line-strong);box-shadow:var(--e-2)}
  .node.fact{border-color:var(--ocean);background:var(--raised)}
  .node.fact .nh{background:var(--ocean);color:#fff}
  .node .nh{font-family:var(--f-m);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 12px;border-radius:5px 5px 0 0;background:var(--softer);color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
  .node .nh .cnt{opacity:0.7;font-weight:400}
  .node .nb{padding:6px 0;font-family:var(--f-m);font-size:11.5px}
  .node .nb .col{padding:4px 12px;display:flex;justify-content:space-between;color:var(--ink-2)}
  .node .nb .col:hover{background:var(--softer)}
  .node .nb .col .type{color:var(--muted);font-size:10px}
  .node .nb .col.pk{color:var(--ocean);font-weight:500}
  .node .nb .col.fk{color:var(--ai)}
  .schema-svg{position:absolute;inset:0;pointer-events:none}

  /* =========== SEMANTIC LAYER =========== */
  .sem-list{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .sem-row{display:grid;grid-template-columns:200px 1fr 140px 120px;gap:18px;padding:14px 18px;border-bottom:1px solid var(--softer);align-items:center;cursor:pointer;transition:background 100ms}
  .sem-row:last-child{border-bottom:none}
  .sem-row:hover{background:var(--softer)}
  .sem-row.head{background:var(--softer);cursor:default;font-family:var(--f-m);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);padding:10px 18px}
  .sem-row.head:hover{background:var(--softer)}
  .sem-row .col-name{font-family:var(--f-m);font-size:12.5px;color:var(--ink);font-weight:500}
  .sem-row .def{font-family:var(--f-d);font-size:14px;color:var(--ink-2);line-height:1.4}
  .sem-row .def.empty{color:var(--muted-2);font-style:italic}
  .sem-row .def .ai-tag{display:inline-flex;align-items:center;gap:5px;margin-right:8px;vertical-align:baseline}
  .sem-row .def .ai-tag .pip{width:5px;height:5px;border-radius:50%;background:var(--ai)}
  .sem-row .def .ai-tag span{font-family:var(--f-m);font-size:9.5px;color:var(--ai);letter-spacing:0.08em;text-transform:uppercase;font-weight:500}

  /* =========== QUALITY =========== */
  .q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .q-ring{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;display:flex;gap:18px;align-items:center}
  .q-ring .sv{flex-shrink:0}
  .q-ring .meta .l{font-family:var(--f-m);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .q-ring .meta .n{font-family:var(--f-d);font-weight:500;font-size:30px;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums}
  .q-ring .meta .s{font-family:var(--f-m);font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:0.04em}

  .q-list-row{display:grid;grid-template-columns:24px 200px 1fr 80px 100px 110px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--softer)}
  .q-list-row:last-child{border-bottom:none}
  .q-list-row .s-dot{width:8px;height:8px;border-radius:50%}
  .q-list-row .t{font-family:var(--f-m);font-size:12px;color:var(--ink)}
  .q-list-row .rule{font-size:13.5px;color:var(--ink-2)}
  .q-list-row .bar{height:4px;background:var(--softer);border-radius:2px;overflow:hidden;position:relative}
  .q-list-row .bar .f{position:absolute;inset:0;background:var(--ok);border-radius:2px}

  /* =========== REPORTS =========== */
  .report-doc{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:56px 72px;max-width:960px;margin:0 auto;box-shadow:var(--e-2)}
  .report-doc .r-eyebrow{font-family:var(--f-m);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .report-doc h1{font-family:var(--f-d);font-weight:500;font-size:44px;letter-spacing:-0.025em;line-height:1.05;margin:0 0 8px}
  .report-doc .r-sub{font-family:var(--f-d);font-style:italic;font-size:18px;color:var(--muted);margin:0 0 32px}
  .report-doc h3{font-family:var(--f-d);font-weight:500;font-size:22px;letter-spacing:-0.015em;margin:36px 0 14px}
  .report-doc p{font-size:15px;line-height:1.65;color:var(--ink-2);margin:0 0 12px}
  .report-doc .tldr{background:var(--ocean-softer);border:1px solid var(--ocean-soft);border-radius:var(--r-sm);padding:20px 24px;margin:0 0 28px}
  .report-doc .tldr .l{font-family:var(--f-m);font-size:10px;letter-spacing:0.14em;color:var(--ocean);margin-bottom:8px}
  .report-doc .tldr p{font-family:var(--f-d);font-size:17px;line-height:1.5;color:var(--ink);margin:0}
  .report-doc .tldr p em{font-style:italic}
  .r-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0 12px;padding:24px 0;border-top:1px solid var(--softer);border-bottom:1px solid var(--softer)}

  .tweaks .group label{display:block;font-family:var(--f-m);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

  .tweaks .seg button{flex:1;padding:7px 10px;background:var(--raised);border:none;font-size:12px;color:var(--ink-2);cursor:pointer;font-family:var(--f-b);border-right:1px solid var(--line);transition:background 100ms}

  .tweaks .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left 120ms}
  .tweaks .toggle.on{background:var(--ocean)}
  .tweaks .toggle.on::after{left:14px}

  /* Ambient bg variation */
  body.amb-warm{--bg:#efece6;--softer:#ebe7de;--soft:#e2ddd2;--line:#d6d0c2}

  .status-banner .pip{width:7px;height:7px;border-radius:50%;background:var(--ocean);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .status-banner .l{color:var(--ocean);font-weight:500;flex:1}
  .status-banner .meta{font-family:var(--f-m);font-size:10.5px;color:var(--ocean);letter-spacing:0.06em;opacity:0.8}

  /* Chart area */
  .ca .grid{stroke:var(--line);stroke-width:0.5;stroke-dasharray:2 3}
  .ca .axis-label{font-family:var(--f-m);font-size:9.5px;fill:var(--muted)}
  .ca .value-label{font-family:var(--f-m);font-size:10px;fill:var(--ink);font-weight:500}
</style>
</head>
<body>
<div id="app"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ═══════════════════════════════════════════════════════
// TWEAKS DEFAULTS (editable block)
// ═══════════════════════════════════════════════════════
const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "askLayout": "hero",
  "density": "balanced",
  "ambient": "cool",
  "aiVoice": "editorial",
  "showStatusBanner": true
}/*EDITMODE-END*/;

// ═══════════════════════════════════════════════════════
// ICONS (thin mono strokes)
// ═══════════════════════════════════════════════════════
const I = {
  ask: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><path d="M3 5.5c0-2 1.5-3.5 4-3.5s4 1.5 4 3.5c0 2.5-4 3-4 5.5M7 12.5v0" stroke="currentColor" strokeWidth="1.25" strokeLinecap="round"/></svg>,
  dash: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><rect x="1.5" y="1.5" width="5" height="5" rx="0.5" stroke="currentColor" strokeWidth="1.25"/><rect x="7.5" y="1.5" width="5" height="5" rx="0.5" stroke="currentColor" strokeWidth="1.25"/><rect x="1.5" y="7.5" width="5" height="5" rx="0.5" stroke="currentColor" strokeWidth="1.25"/><rect x="7.5" y="7.5" width="5" height="5" rx="0.5" stroke="currentColor" strokeWidth="1.25"/></svg>,
  rep: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><path d="M3 1.5h6l2.5 2.5v9H3v-11z" stroke="currentColor" strokeWidth="1.25" strokeLinejoin="round"/><path d="M4.5 6h5M4.5 8.5h5M4.5 11h3" stroke="currentColor" strokeWidth="1.25" strokeLinecap="round"/></svg>,
  sem: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><circle cx="3" cy="3" r="1.5" stroke="currentColor" strokeWidth="1.25"/><circle cx="11" cy="3" r="1.5" stroke="currentColor" strokeWidth="1.25"/><circle cx="7" cy="11" r="1.5" stroke="currentColor" strokeWidth="1.25"/><path d="M4 4L6 10M10 4L8 10M4.5 3h6" stroke="currentColor" strokeWidth="1.25"/></svg>,
  prod: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><path d="M7 1L13 7L7 13L1 7L7 1Z" stroke="currentColor" strokeWidth="1.25" strokeLinejoin="round"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>,
  qual: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><path d="M7 1L12.5 3.5V7.5C12.5 10 7 13 7 13S1.5 10 1.5 7.5V3.5L7 1Z" stroke="currentColor" strokeWidth="1.25" strokeLinejoin="round"/><path d="M5 7L6.5 8.5L9 6" stroke="currentColor" strokeWidth="1.25" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  src: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><ellipse cx="7" cy="3" rx="5" ry="1.5" stroke="currentColor" strokeWidth="1.25"/><path d="M2 3v4c0 0.8 2.2 1.5 5 1.5s5-0.7 5-1.5V3M2 7v4c0 0.8 2.2 1.5 5 1.5s5-0.7 5-1.5V7" stroke="currentColor" strokeWidth="1.25"/></svg>,
  team: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><circle cx="5" cy="4.5" r="2" stroke="currentColor" strokeWidth="1.25"/><path d="M1.5 11.5c0-1.7 1.5-3 3.5-3s3.5 1.3 3.5 3" stroke="currentColor" strokeWidth="1.25" strokeLinecap="round"/><circle cx="10.5" cy="4.5" r="1.5" stroke="currentColor" strokeWidth="1.1"/><path d="M9 11c0-1.5 1-2.5 2.5-2.5" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/></svg>,
  bell: (p={}) => <svg {...p} viewBox="0 0 16 16" fill="none"><path d="M4 7c0-2.2 1.8-4 4-4s4 1.8 4 4v3l1 1.5H3L4 10V7z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><path d="M6.5 13.5c0 0.8 0.7 1.5 1.5 1.5s1.5-0.7 1.5-1.5" stroke="currentColor" strokeWidth="1.3"/></svg>,
  arrUp: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><path d="M7 11V3M3.5 6.5L7 3L10.5 6.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  dots: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><circle cx="3" cy="7" r="1" fill="currentColor"/><circle cx="7" cy="7" r="1" fill="currentColor"/><circle cx="11" cy="7" r="1" fill="currentColor"/></svg>,
  logo: (p={}) => <svg {...p} viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="currentColor" strokeWidth="1.5"/><circle cx="16" cy="16" r="8" stroke="currentColor" strokeWidth="1.2"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg>,
  tweak: (p={}) => <svg {...p} viewBox="0 0 14 14" fill="none"><path d="M1.5 3.5h6M9 3.5h3.5M1.5 10.5h3M6 10.5h6.5" stroke="currentColor" strokeWidth="1.25" strokeLinecap="round"/><circle cx="8" cy="3.5" r="1.25" fill="var(--raised)" stroke="currentColor" strokeWidth="1.25"/><circle cx="5" cy="10.5" r="1.25" fill="var(--raised)" stroke="currentColor" strokeWidth="1.25"/></svg>,
};

// ═══════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════
function App(){
  const [screen, setScreen] = useState(() => localStorage.getItem('db_screen') || 'ask');
  const [tweaks, setTweaks] = useState(() => {
    try { return { ...TWEAKS_DEFAULTS, ...JSON.parse(localStorage.getItem('db_tweaks')||'{}') } }
    catch { return TWEAKS_DEFAULTS }
  });
  const [tweaksOn, setTweaksOn] = useState(false);

  useEffect(() => { localStorage.setItem('db_screen', screen) }, [screen]);
  useEffect(() => { localStorage.setItem('db_tweaks', JSON.stringify(tweaks)) }, [tweaks]);

  useEffect(() => {
    document.body.classList.toggle('dense', tweaks.density === 'dense');
    document.body.classList.toggle('amb-warm', tweaks.ambient === 'warm');
  }, [tweaks]);

  // Tweaks host protocol
  useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOn(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  return (<>
    <Chrome />
    <div className="body">
      <Rail active={screen} setScreen={setScreen} />
      <main className="main">
        <div className="main-inner" data-screen-label={screenLabel(screen)}>
          {screen === 'ask' && <AskScreen tweaks={tweaks} />}
          {screen === 'dash' && <DashboardScreen tweaks={tweaks} />}
          {screen === 'reports' && <ReportsScreen />}
          {screen === 'semantic' && <SemanticScreen />}
          {screen === 'products' && <ProductsScreen />}
          {screen === 'quality' && <QualityScreen />}
          {screen === 'sources' && <SourcesScreen />}
        </div>
      </main>
    </div>
    <Tweaks on={tweaksOn} tweaks={tweaks} update={update} />
  </>);
}

function screenLabel(s){
  return ({ask:'01 Ask',dash:'02 Dashboards',reports:'03 Reports',semantic:'04 Semantic',products:'05 Products',quality:'06 Quality',sources:'07 Sources'})[s] || s;
}

// ═══════════════════════════════════════════════════════
// CHROME
// ═══════════════════════════════════════════════════════
function Chrome(){
  return (
    <header className="chrome">
      <div className="wm"><I.logo width="22" height="22"/> Databridge</div>
      <div className="workspace">ACME · WHOLESALE</div>
      <div className="spacer"/>
      <div className="bell"><I.bell width="15" height="15"/><span className="pip"/></div>

// RAIL

function Rail({active, setScreen}){
  const items = [
    {id:'ask', label:'Ask', icon:I.ask, kbd:'⌘1'},
    {id:'dash', label:'Dashboards', icon:I.dash, count:'14'},
    {id:'reports', label:'Reports', icon:I.rep, count:'6'},
  ];
  const model = [
    {id:'semantic', label:'Semantic', icon:I.sem, count:'842'},
    {id:'products', label:'Products', icon:I.prod, count:'3'},
    {id:'quality', label:'Quality', icon:I.qual, dot:true, count:'2'},
  ];
  const admin = [
    {id:'sources', label:'Sources', icon:I.src},
    {id:'team', label:'Team', icon:I.team, disabled:true},
  ];
  const render = (it) => (
    <div key={it.id} className={`item${active===it.id?' active':''}`} onClick={() => !it.disabled && setScreen(it.id)} style={it.disabled?{opacity:0.4,cursor:'not-allowed'}:{}}>
      <div className="r"><it.icon className="ico" width="14" height="14"/><span>{it.label}</span></div>
      {it.kbd ? <span className="count">{it.kbd}</span> : it.dot ? <span className="dot"/> : it.count ? <span className="count">{it.count}</span> : null}
    </div>
  );
  return (
    <aside className="rail">
      <div className="sec">Workspace</div>
      {items.map(render)}
      <div className="sec">Model</div>
      {model.map(render)}
      <div className="sec">Admin</div>
      {admin.map(render)}
      <div className="spacer" style={{minHeight:40}}/>
      <div style={{padding:'10px 12px',borderTop:'1px solid var(--softer)',marginTop:8}}>
        <div style={{fontFamily:'var(--f-m)',fontSize:10,letterSpacing:'0.08em',color:'var(--muted)',marginBottom:6}}>DATA FRESHNESS</div>
        <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'var(--ink-2)'}}>
          <span style={{width:6,height:6,borderRadius:'50%',background:'var(--ok)'}}/>
          <span style={{fontFamily:'var(--f-m)',fontSize:11}}>14m ago</span>
        </div>
      </div>
    </aside>
  );
}

// ═══════════════════════════════════════════════════════
// 01 · ASK SCREEN
// ═══════════════════════════════════════════════════════
function AskScreen({tweaks}){
  const [query, setQuery] = useState('');
  const [thread, setThread] = useState([]);
  const [thinking, setThinking] = useState(false);

  const hints = [
    "What drove our Q3 revenue?",
    "Top 10 customers by lifetime value",
    "Which products are underperforming?",
    "Compare direct vs wholesale margins",
  ];

  const submit = (q) => {
    if (!q.trim()) return;
    setThread(t => [...t, {q, a: null}]);
    setQuery('');
    setThinking(true);
    setTimeout(() => {
      setThread(t => t.map((x,i) => i === t.length-1 ? {...x, a: sampleAnswer(q, tweaks.aiVoice)} : x));
      setThinking(false);
    }, 1400);
  };

  const hasThread = thread.length > 0;

  return (
    <div className="ask-wrap">
      {!hasThread && tweaks.askLayout === 'hero' && (
        <div className="ask-hero">
          <h1><em>Ask anything.</em></h1>
          <p className="sub">Plain language. Real answers. Sourced from your data.</p>
        </div>
      )}
      {!hasThread && tweaks.askLayout === 'compact' && (
        <div style={{padding:'24px 0 12px'}}>
          <div className="label" style={{marginBottom:8}}>ASK</div>
          <h1 style={{fontFamily:'var(--f-d)',fontWeight:500,fontSize:28,letterSpacing:'-0.015em',margin:0,lineHeight:1.15}}>What do you want to know?</h1>
        </div>
      )}

      <div className="ask-input-wrap">
        <input
          className="ask-input"
          placeholder="e.g. What drove our Q3 revenue growth?"
          value={query}
          onChange={e => setQuery(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && submit(query)}
        />
        <button className="ask-send" onClick={() => submit(query)}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M7.5 3.5L11 7L7.5 10.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>

      {!hasThread && (
        <div className="ask-hints">
          {hints.map(h => <button key={h} className="chip" onClick={() => submit(h)}><span className="arr">↗</span>{h}</button>)}
        </div>
      )}

      {hasThread && (
        <div className="ask-thread">
          {thread.map((t, i) => (
            <React.Fragment key={i}>
              <div className="ask-q">
                <div className="who">You · 14:23</div>
                <p className="q">{t.q}</p>
              </div>
              {t.a ? <AIMessage answer={t.a} /> : <AIThinking />}
            </React.Fragment>
          ))}
        </div>
      )}
    </div>
  );
}

function AIThinking(){
  return (
    <div className="ai-msg">
      <div className="ai-head">
        <span className="ai-avatar"><span className="shimmer"><span className="dot"/><span className="dot"/><span className="dot"/></span></span>
        <span className="badge b-ai"><span className="pip"/>READING · fact_sales, dim_customer</span>
      </div>
      <div className="ai-body" style={{color:'var(--muted)'}}>Thinking through the last 12 months…</div>

}

function AIMessage({answer}){
  return (
    <div className="ai-msg">

        <span className="ai-avatar"><span className="shimmer"><span className="dot"/><span className="dot"/><span className="dot"/></span></span>

          </div>
        </div>
        <div style={{paddingTop:8}}>
          <div className="q-list-row" style={{background:'var(--softer)',color:'var(--muted)',fontFamily:'var(--f-m)',fontSize:10,textTransform:'uppercase',letterSpacing:'0.08em',padding:'10px 18px'}}>
            <div></div><div>TABLE · COLUMN</div><div>RULE</div><div className="num" style={{textAlign:'left'}}>PASS</div><div>LAST RUN</div><div>STATUS</div>
          </div>
          <QRow c="var(--err)" t="dim_product.cost_basis_eur" rule="Must be non-null for active SKUs" pct={72} run="14m ago" s="fail"/>
          <QRow c="var(--err)" t="fact_sales.channel_code" rule="Must be one of WHS, DIR, PRT, OEM" pct={99.6} run="14m ago" s="fail"/>
          <QRow c="var(--warn)" t="dim_customer.email" rule="Must match email regex" pct={97.1} run="14m ago" s="warn"/>
          <QRow c="var(--ok)" t="fact_sales.order_line_amt" rule="Must be positive" pct={100} run="14m ago" s="ok"/>
          <QRow c="var(--ok)" t="dim_customer.customer_id" rule="Must be unique" pct={100} run="14m ago" s="ok"/>
          <QRow c="var(--ok)" t="dim_region.region_code" rule="Must match ISO 3166-2" pct={100} run="14m ago" s="ok"/>
        </div>
      </div>
    </>
  );
}

function QRing({l,n,sub,pct,c}){
  const circ = 2*Math.PI*22;
  return (
    <div className="q-ring">
      <svg className="sv" width="62" height="62" viewBox="0 0 62 62">
        <circle cx="31" cy="31" r="22" stroke="var(--softer)" strokeWidth="4" fill="none"/>
        <circle cx="31" cy="31" r="22" stroke={c} strokeWidth="4" fill="none" strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round" transform="rotate(-90 31 31)"/>
      </svg>
      <div className="meta">
        <div className="l">{l}</div>
        <div className="n">{n}</div>
        <div className="s">{sub}</div>
      </div>
    </div>
  );
}

function QRow({c,t,rule,pct,run,s}){
  return (
    <div className="q-list-row">
      <div className="s-dot" style={{background:c}}/>
      <div className="t">{t}</div>
      <div className="rule">{rule}</div>
      <div><div className="bar"><div className="f" style={{width:pct+'%',background:c}}/></div><div style={{fontFamily:'var(--f-m)',fontSize:10.5,color:'var(--muted)',marginTop:4,letterSpacing:'0.04em'}}>{pct}%</div></div>
      <div style={{fontFamily:'var(--f-m)',fontSize:11,color:'var(--muted)',letterSpacing:'0.04em'}}>{run}</div>
      <div>
        {s==='fail' && <span className="badge b-err"><span className="pip"/>FAIL</span>}
        {s==='warn' && <span className="badge b-warn"><span className="pip"/>WARN</span>}
        {s==='ok' && <span className="badge b-ok"><span className="pip"/>PASS</span>}
      </div>
    </div>
  );
}

      <div className="group">
