# Clarion source package — Odoo. Format: src/sourcePackage/types.ts.
# Documented many2one foreign keys and the star-schema template live here; each model is a file under datasets/, each template table under model/.

version: 1
name: odoo
description: Odoo — open-source ERP. Read-only over JSON-2 (Odoo 19+/Online) or XML-RPC (older on-prem); one database per connection.
clarion:
  vendor: { name: Odoo, docs: https://www.odoo.com/documentation/, transcribed: 2026-07-20 }
  provenance: declared
  fieldCoverage: partial
  categories:
    - Contacts
    - Accounting
    - Products
    - Sales
    - Purchasing
    - Inventory
  template:
    version: 2
    products:
      - name: Core dimensions
        description: "Conformed dimensions shared by every Odoo data product: partners, products, accounts, journals, companies, currencies."
        buildOrder: 1
      - name: Finance
        description: "Accounting analytics: general ledger, invoices and bills, payments."
        buildOrder: 2
      - name: Sales
        description: "Sales analytics: orders, quantities, delivery and invoicing progress."
        buildOrder: 3
      - name: Purchasing
        description: "Purchasing analytics: orders placed with vendors, receipts and billing progress."
        buildOrder: 4
      - name: Inventory
        description: "Inventory analytics: product movements over time."
        buildOrder: 5
