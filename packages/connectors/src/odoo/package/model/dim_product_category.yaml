# Odoo star-schema template table. `source` is the DuckDB SQL over BARE source entity names; a foreign key is written ONCE on its field (clarion.references) and the template joins are derived from it.

name: dim_product_category
label: Product categories
description: Hierarchical product categories.
source: |-
  SELECT
    id            AS category_id,
    name          AS category_name,
    complete_name AS category_path,
    parent_id
  FROM product_category
fields:
  - name: category_id
    label: Category ID
    description: Odoo product category id (primary key).
    datatype: BIGINT
    clarion: { role: natural_key, technical: true, lineage: { dataset: product_category, field: id } }
  - name: category_name
    label: Category name
    description: Name of the category.
    datatype: VARCHAR
    clarion: { role: attribute, lineage: { dataset: product_category, field: name } }
  - name: category_path
    label: Category path
    description: Full hierarchical path (e.g. "All / Saleable / Office").
    datatype: VARCHAR
    clarion: { role: attribute, lineage: { dataset: product_category, field: complete_name } }
  - name: parent_id
    label: Parent category
    description: Parent category in the hierarchy.
    datatype: BIGINT
    clarion:
      role: foreign_key
      references: { dataset: dim_product_category, field: category_id }
      technical: true
      lineage: { dataset: product_category, field: parent_id }
clarion: { kind: dimension, product: Core dimensions, sourceEntities: [ product_category ] }
