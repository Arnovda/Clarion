# Odoo model. `source` is the dotted model name used for RPC; `name` is the warehouse table. Field descriptions are the curated fallback beneath the live fields_get harvest (Odoo 16+ semantics).

name: sale_order
label: Sales orders
description: Sales orders and quotations — one row per order, header level (state distinguishes quotation vs confirmed).
source: sale.order
primary_key: [ id ]
fields:
  - name: id
    description: Technical identifier of the sales order
  - name: name
    description: Order number (e.g. S00042)
  - name: partner_id
    description: Customer the order is for
  - name: partner_invoice_id
    description: Invoice address used for the order
  - name: partner_shipping_id
    description: Delivery address used for the order
  - name: date_order
    description: Date the quotation was created or the order confirmed
  - name: state
    description: "Lifecycle state: draft quotation, sent, confirmed sale or cancelled"
  - name: invoice_status
    description: "Invoicing progress: nothing to invoice, to invoice or fully invoiced"
  - name: amount_untaxed
    description: Order total before taxes
  - name: amount_tax
    description: Total tax amount on the order
  - name: amount_total
    description: Order total including taxes
  - name: currency_id
    description: Currency of the order amounts
  - name: company_id
    description: Company the order belongs to
  - name: user_id
    description: Salesperson responsible for the order
  - name: team_id
    description: Sales team the order is attributed to
  - name: client_order_ref
    description: Customer reference for the order
  - name: create_date
    description: When the record was created
  - name: write_date
    description: When the record was last modified
clarion:
  kind: source
  category: Sales
  sync:
    cursor: { field: write_date, type: timestamp }
