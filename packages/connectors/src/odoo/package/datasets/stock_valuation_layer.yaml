# Odoo model. `source` is the dotted model name used for RPC; `name` is the warehouse table. Field descriptions are the curated fallback beneath the live fields_get harvest (Odoo 16+ semantics).

name: stock_valuation_layer
label: Stock valuation layers
description: Inventory valuation entries — the monetary value of stock moves (absent on some Odoo versions).
source: stock.valuation.layer
primary_key: [ id ]
fields:
  - name: id
    description: Technical identifier of the valuation layer
  - name: product_id
    description: Product variant the valuation entry is for
  - name: quantity
    description: Quantity added to or removed from stock by this layer
  - name: value
    description: Monetary value of the layer in company currency
  - name: unit_cost
    description: Unit cost used for this layer
  - name: stock_move_id
    description: Stock move that generated this valuation entry
  - name: company_id
    description: Company the valuation belongs to
  - name: create_date
    description: When the valuation entry was created
clarion:
  kind: source
  category: Inventory
  sync:
    cursor: { field: write_date, type: timestamp }
