# Odoo model. `source` is the dotted model name used for RPC; `name` is the warehouse table. Field descriptions are the curated fallback beneath the live fields_get harvest (Odoo 16+ semantics).

name: account_move
label: Journal entries / invoices
description: Journal entries, including customer invoices, vendor bills and credit notes (move_type distinguishes them). One row per document, header level.
source: account.move
primary_key: [ id ]
fields:
  - name: id
    description: Technical identifier of the journal entry
  - name: name
    description: Document number (e.g. INV/2026/0001)
  - name: move_type
    description: "Document kind: customer invoice, credit note, vendor bill, refund or misc entry"
  - name: partner_id
    description: Customer or vendor the document belongs to
  - name: invoice_date
    description: Invoice or bill date printed on the document
  - name: invoice_date_due
    description: Date the invoice is due for payment
  - name: date
    description: Accounting date the entry is posted on
  - name: state
    description: "Lifecycle state: draft, posted or cancelled"
  - name: payment_state
    description: "Payment progress: not paid, in payment, paid, partially paid or reversed"
  - name: journal_id
    description: Journal the entry is posted in
  - name: company_id
    description: Company the entry belongs to
  - name: currency_id
    description: Currency of the document amounts
  - name: amount_untaxed
    description: Total before taxes, in document currency
  - name: amount_tax
    description: Total tax amount, in document currency
  - name: amount_total
    description: Total including taxes, in document currency
  - name: amount_residual
    description: Amount still open (unpaid), in document currency
  - name: invoice_origin
    description: Source document (e.g. the sales order) the invoice was created from
  - name: ref
    description: External reference, e.g. the vendor bill number
  - name: invoice_payment_term_id
    description: Payment terms applied to this invoice
  - name: create_date
    description: When the record was created
  - name: write_date
    description: When the record was last modified
clarion:
  kind: source
  category: Accounting
  sync:
    cursor: { field: write_date, type: timestamp }
