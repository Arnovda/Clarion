# Odoo model. `source` is the dotted model name used for RPC; `name` is the warehouse table. Field descriptions are the curated fallback beneath the live fields_get harvest (Odoo 16+ semantics).

name: account_journal
label: Journals
description: Accounting journals (sales, purchases, bank, cash, miscellaneous) that entries are posted in.
source: account.journal
primary_key: [ id ]
fields:
  - name: id
    description: Technical identifier of the journal
  - name: name
    description: Name of the journal
  - name: code
    description: Short code of the journal shown in entry numbers
  - name: type
    description: "Journal kind: sale, purchase, bank, cash or general"
  - name: company_id
    description: Company this journal belongs to
  - name: currency_id
    description: Currency of the journal when it differs from the company currency
  - name: write_date
    description: When the record was last modified
clarion:
  kind: source
  category: Accounting
  sync:
    cursor: { field: write_date, type: timestamp }
