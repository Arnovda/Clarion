name: GLAccounts
label: GL accounts
description: Chart of accounts.
source: /financial/GLAccounts
primary_key: [ ID ]
fields:
  - name: AllowCostsInSales
    description: Allow cost base amount and vat amount to be generated in sales entries
    datatype: Edm.Byte
  - name: AssimilatedVATBox
    description: AssimilatedVATBox (France)
    datatype: Edm.Int16
  - name: BalanceSide
    description: "The following values are supported: D (Debit) C (Credit)"
    datatype: Edm.String
    clarion: { role: dimension }
  - name: BalanceType
    description: "The following values are supported: B (Balance Sheet) W (Profit & Loss)"
    datatype: Edm.String
    clarion: { role: dimension }
  - name: BelcotaxType
    description: Indentify the kind of rewarding for the G/L account. This is used in the official document for the fiscal fiches Belcotax
    datatype: Edm.Int32
  - name: Code
    description: Unique Code of the G/L account
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Compress
    description: Indicate if this G/L account should be shown as compressed without the details in the CRW report of G/L history
    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: Costcenter
    description: Cost Center linked to the G/L account
    datatype: Edm.String
    clarion: { role: dimension }
  - name: CostcenterDescription
    description: Description of Costcenter
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Costunit
    description: Cost Unit linked to the G/L account
    datatype: Edm.String
    clarion: { role: dimension }
  - name: CostunitDescription
    description: Description of Costunit
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Created
    description: Creation date
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: Creator
    description: User ID of creator
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: CreatorFullName
    description: Name of creator
    datatype: Edm.String
    clarion: { role: dimension }
  - name: CustomField
    description: Custom field endpoint
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Description
    description: Name of the G/L account. If Multilanguage featureset is enabled in the administration and the G/L account already has a set of termed description, this field is not allowed to change.
    datatype: Edm.String
    clarion: { role: dimension }
  - name: DescriptionTermID
    description: Term ID for description
    datatype: Edm.Int32
  - name: Division
    description: Division code
    datatype: Edm.Int32
  - name: ExcludeVATListing
    description: General ledger transactions on this G/L account should not appear on the VAT listing
    datatype: Edm.Byte
  - name: ExpenseNonDeductiblePercentage
    description: Expenses on this G/L account can not be used to reduce the incomes
    datatype: Edm.Double
    clarion: { role: measure }
  - name: ID
    description: Primary Key
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: IsBlocked
    description: When blocked you can't use this general ledger account anymore for new entries
    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: Matching
    description: Allow entries on this general ledger account to be matched via the G/L account card
    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: Modified
    description: Last modified date
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: Modifier
    description: User ID of modifier
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: ModifierFullName
    description: Name of modifier
    datatype: Edm.String
    clarion: { role: dimension }
  - name: PrivateGLAccount
    description: If a private use percentage is defined, you need to specify the G/L account used for the re-invoice of the private use to the owner of the company
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: GLAccounts, field: ID } }
  - name: PrivatePercentage
    description: Specify the percentage of the cost that should be re-invoiced to the owner of the company as private use of the costs
    datatype: Edm.Double
    clarion: { role: measure }
  - name: ReportingCode
    description: Used in the export of yearly report
    datatype: Edm.String
    clarion: { role: dimension }
  - name: RevalueCurrency
    description: Indicates if the amounts booked on this general ledger account will be recalculated when currency revaluation is done
    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: SearchCode
    description: Search Code
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Type
    description: "The type of the G/L account. Supported values are: 10 = Cash 12 = Bank 14 = Credit card 16 = Payment services 20 = Accounts receivable 21 = Prepayment accounts receivable 22 = Accounts payable 24 = VAT 25 = Employees payable 26 = Prepaid expenses 27 = Accrued expenses 29 = Income taxes payable 30 = Fixed assets 32 = Other assets 35 = Accumulated depreciation 40 = Inventory 50 = Capital stock 52 = Retained earnings 55 = Long term debt 60 = Current portion of debt 90 = General 100 = Tax payable 110 = Revenue 111 = Cost of goods 120 = Other costs 121 = Sales, general administrative expenses 122 = Depreciation costs 123 = Research and development 125 = Employee costs 126 = Employment costs 130 = Exceptional costs 140 = Exceptional income 150 = Income taxes 160 = Interest income 300 = Year end reflection 301 = Indirect year end costing 302 = Direct year end costing"
    datatype: Edm.Int32
  - name: TypeDescription
    description: Description of Type
    datatype: Edm.String
    clarion: { role: dimension }
  - name: UseCostcenter
    description: "Indicates if cost centers can be used when using this general ledger account. The following values are supported: 0 (Optional) 1 (Mandatory) 2 (No)"
    datatype: Edm.Byte
  - name: UseCostunit
    description: "Indicates if cost units can be used when using this general ledger account. The following values are supported: 0 (Optional) 1 (Mandatory) 2 (No)"
    datatype: Edm.Byte
  - name: VATCode
    description: VAT Code linked to the G/L account
    datatype: Edm.String
    clarion: { role: dimension }
  - name: VATDescription
    description: Description of VAT
    datatype: Edm.String
    clarion: { role: dimension }
  - name: VATGLAccountType
    description: Specify the kind of purchase this G/L account is used for. This is important for the Belgian VAT return to indicate in which VAT box the base amount of purchase should go
    datatype: Edm.String
    clarion: { role: dimension }
  - name: VATNonDeductibleGLAccount
    description: If you use a percentage of non deductible VAT, you can specify another G/L account that will be used for the non deductible part of the VAT amount. This is used directly in the entry application of purchase invoices.
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: GLAccounts, field: ID } }
  - name: VATNonDeductiblePercentage
    description: If not the full amount of the VAT is deductible, you can indicate a percentage for the non decuctible part. This is used during the entry of purchase invoices
    datatype: Edm.Double
    clarion: { role: measure }
  - name: VATSystem
    description: "The following values are supported: I (Invoice) C (Cash) (France)"
    datatype: Edm.String
    clarion: { role: dimension }
  - name: YearEndCostGLAccount
    description: Indicates the costing account for year end calculations
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: GLAccounts, field: ID } }
  - name: YearEndReflectionGLAccount
    description: Indicates the reflection account that is used by year end application
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: GLAccounts, field: ID } }
clarion:
  kind: source
  category: Financial
