name: EmploymentContracts
label: Employment contracts
description: Contract terms (FTE, contract type, start/end) per employment.
source: /payroll/EmploymentContracts
primary_key: [ ID ]
fields:
  - name: ContractFlexPhase
    description: Flexible employment contract phase
    datatype: Edm.Int32
  - name: ContractFlexPhaseDescription
    description: Flexible employment contract phase description.
    datatype: Edm.String
    clarion: { role: dimension }
  - name: CreateAutoCorrection
    description: "Confirmation: Create Auto Correction When the 'payroll run' already finalized and the update is made to the employment contract start date, the system will first block the PUT action with the message below. With the 'PayrollCorrection' right, the error message below will be thrown: &emsp;This change will lead to a recalculation of previous periods. A correction request will be created with the following data: &emsp;&emsp;Activation date: 01-01-2019 &emsp;&emsp;Payroll year: 2019 &emsp;&emsp;Period: 1 &emsp;If you are confirmed want to proceed, set the [CreateAutoCorrection] to True and re-submit the request. Without the 'PayrollCorrection' right, the error message below will be thrown: &emsp;You do not have rights to change data that can influence processed payroll transactions. Note : If you delete this contract in an already calculated period, auto corrections will be created for this employee."
    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: Created
    description: Creation date
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: CreatePredecessorsForLinkedAgencies
    description: "Confirmation: Create Predecessors For Linked Agencies The system will block the POST/PUT action when one of the condition below fulfilled: When create (POST) a new successor, the employment contract successor start date is set to an earlier payroll year. When update (PUT) the existing employment contract start date to an earlier payroll year. The error message below will be thrown: &emsp;Attention: If you change the start date to an earlier payroll year, predecessors will be created for linked agencies. &emsp;You will have to check if the data of the predecessors is correct. &emsp;If you are confirmed want to proceed, set the [CreatePredecessorsForLinkedAgencies] to True and re-submit the request."
    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: Creator
