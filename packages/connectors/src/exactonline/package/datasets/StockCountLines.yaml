name: StockCountLines
label: Stock count lines
description: Per-item count detail for each stock count run.
source: /inventory/StockCountLines
primary_key: [ ID ]
fields:
  - name: CostPrice
    description: Cost price of the item that is used to create the stock count
    datatype: Edm.Double
    clarion: { role: measure }
  - name: CountedBy
    description: Counted by
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: Created
    description: Creation date
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: Creator
    description: User ID of creator
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: CreatorFullName
    description: Name of creator
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Division
    description: Division code
    datatype: Edm.Int32
  - name: ID
    description: Primary key
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: Item
    description: Reference to the item for which the stock is counted
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Items, field: ID } }
  - name: ItemBarcode
    description: Item Barcode
    datatype: Edm.String
    clarion: { role: dimension }
  - name: ItemCode
    description: Item code
    datatype: Edm.String
    clarion: { role: dimension }
  - name: ItemCostPrice
