    datatype: Edm.Boolean
    clarion: { role: dimension }
  - name: LineNumber
    description: Line number
    datatype: Edm.Int32
  - name: Modified
    description: Last modified date
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: Modifier
    description: User ID of modifier
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: ModifierFullName
    description: Name of modifier
    datatype: Edm.String
    clarion: { role: dimension }
  - name: QuantityDifference
    description: The difference between the current quantity in stock and the new quantity in stock. For example specify -1 for this field to correct the quantity if one item in stock is broken.
    datatype: Edm.Double
    clarion: { role: measure }
  - name: QuantityInStock
    description: The current quantity available in stock
    datatype: Edm.Double
    clarion: { role: measure }
  - name: QuantityNew
