    datatype: Edm.Double
    clarion: { role: measure }
  - name: ReasonCode
    description: Reason code for logistics
    datatype: Edm.String
    clarion: { role: dimension }
  - name: ReasonCodeDescription
    description: Reason code for logistics description
    datatype: Edm.String
    clarion: { role: dimension }
  - name: ReasonCodeID
    description: Reason code for logistics id
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: Source
    description: "Source of stock count entry: 1-Manual entry, 2-Import, 3-Stock count, 4-Web service"
    datatype: Edm.Int16
  - name: Status
    description: "Stock count status: 12-Draft, 21-Processed"
    datatype: Edm.Int16
  - name: StockCountID
    description: Identifies the stock count. All the lines of a stock count have the same StockCountID
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: StockCounts, field: StockCountID } }
  - name: StockKeepingUnit
    description: Stock item's unit description
