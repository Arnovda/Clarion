# Exact Online entity. Field docs are TRANSCRIBED from the vendor REST reference by scripts/generate-eo-docs.ts — do not hand-edit descriptions; edit label/description/clarion freely.

name: Documents
label: Documents
description: Business documents (invoices, receipts, contracts) attached to accounts. High volume on active divisions but no built-in filter — full history ingested.
source: /documents/Documents
primary_key: [ ID ]
