    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: OpeningBalanceFC
    description: Opening balance in the currency of the transaction
    datatype: Edm.Double
    clarion: { role: measure }
  - name: Status
    description: "Status: 20 = Open, 50 = Processed"
    datatype: Edm.Int16
  - name: StatusDescription
    description: Description of Status
    datatype: Edm.String
    clarion: { role: dimension }
