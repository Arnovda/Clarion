# Exact Online entity. Field docs are TRANSCRIBED from the vendor REST reference by scripts/generate-eo-docs.ts — do not hand-edit descriptions; edit label/description/clarion freely.

name: SalesInvoices
label: Sales invoices
description: Sales invoice headers — what was billed and to whom.
source: /salesinvoice/SalesInvoices
primary_key: [ ID ]
fields:
  - name: AmountDC
    description: For the header lines (LineNumber = 0) of an entry this is the SUM(AmountDC) of all lines
    datatype: Edm.Double
    clarion: { role: measure }
  - name: AmountDiscount
    description: Discount amount in the default currency of the company
    datatype: Edm.Double
    clarion: { role: measure }
  - name: AmountDiscountExclVat
    description: Discount amount exclude VAT in the default currency of the company
    datatype: Edm.Double
    clarion: { role: measure }
  - name: AmountFC
    description: For the header this is the sum of all lines, including VAT
    datatype: Edm.Double
    clarion: { role: measure }
  - name: AmountFCExclVat
    description: For the header this is the sum of all lines, excluding VAT
    datatype: Edm.Double
    clarion: { role: measure }
  - name: Created
    description: Creation date
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: Creator
    description: User ID of creator
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: CreatorFullName
    description: Name of creator
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Currency
    description: Currency for the invoice. Default this is the currency of the administration
    datatype: Edm.String
    clarion: { role: dimension }
  - name: DeliverTo
    description: Delivery account for invoice
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Accounts, field: ID } }
  - name: DeliverToAddress
    description: Address of delivery as per invoice delivery account
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Addresses, field: ID } }
  - name: DeliverToContactPerson
    description: Delivery account person for invoice
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Contacts, field: ID } }
  - name: DeliverToContactPersonFullName
    description: Name of delivery account's contact person as per invoice
    datatype: Edm.String
    clarion: { role: dimension }
  - name: DeliverToName
    description: Name of the delivery account's customer as per invoice
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Description
    description: Description. Can be different for header and lines
    datatype: Edm.String
    clarion: { role: dimension }
  - name: Discount
    description: Discount percentage
    datatype: Edm.Double
    clarion: { role: measure }
  - name: DiscountType
    description: Leading field of total discount. 1=Discount percentage, 2=Discount amount excl. VAT, 3=Discount amount incl. VAT, 4=Total amount excl. VAT, 5=Total amount incl. VAT
    datatype: Edm.Int16
  - name: Division
    description: Division code
    datatype: Edm.Int32
  - name: Document
    description: Document that is manually linked to the invoice
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Documents, field: ID } }
  - name: DocumentNumber
    description: Number of the document
    datatype: Edm.Int32
  - name: DocumentSubject
    description: Subject of the document
    datatype: Edm.String
    clarion: { role: dimension }
  - name: DueDate
    description: The due date for payments. This date is calculated based on the EntryDate and the Paymentcondition
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: ExtraDutyAmountFC
    description: Extra duty amount in the currency of the transaction. Both extra duty amount and VAT amount need to be specified in order to differ this property from automatically calculated.
    datatype: Edm.Double
    clarion: { role: measure }
  - name: GAccountAmountFC
    description: A positive value of the amount indicates that the amount is to be paid by the customer to your G bank account.In case of a credit invoice the amount should have negative value when retrieved or posted to Exact.
    datatype: Edm.Double
    clarion: { role: measure }
  - name: IncotermAddress
    description: Address of Incoterm
    datatype: Edm.String
    clarion: { role: dimension }
  - name: IncotermCode
    description: Code of Incoterm
    datatype: Edm.String
    clarion: { role: dimension }
  - name: IncotermVersion
    description: "Version of Incoterm Supported version for Incoterms : 2010, 2020"
    datatype: Edm.Int16
  - name: InvoiceDate
    description: Official date for the invoice. When the invoice is entered it's equal to the field 'EntryDate'. During the printing process the invoice date can be entered
    datatype: Edm.DateTime
    clarion: { role: dimension }
  - name: InvoiceID
    description: Primary key
    datatype: Edm.Guid
    clarion: { role: dimension }
  - name: InvoiceNumber
    description: Assigned at entry or at printing depending on setting. The number assigned is based on the freenumbers as defined for the Journal. When printing the field InvoiceNumber is copied to the fields EntryNumber and InvoiceNumber of the sales entry
