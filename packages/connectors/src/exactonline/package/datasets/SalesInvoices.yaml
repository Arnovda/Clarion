    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Accounts, field: ID } }
  - name: OrderedByContactPerson
    description: Contact person of customer who ordered the invoice
    datatype: Edm.Guid
    clarion: { role: dimension, references: { dataset: Contacts, field: ID } }
  - name: OrderedByContactPersonFullName
