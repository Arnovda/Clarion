clarion:
  kind: source
  category: Sales
  sync:
    cursor: { field: Modified, type: timestamp }
  notes: |-
    Invoice headers. The header's `AmountDC` / `AmountFC` are the SUM over the invoice's lines (the vendor documents this on `AmountDC`).

    `InvoiceTo`, `OrderedBy` and `DeliverTo` are three ROLES of Accounts — the billed, ordering and delivery party — and each joins to Accounts separately; "the customer" usually means `InvoiceTo`.

    Credit notes are negative; `Type` tells an invoice from a credit note as a numeric code.
