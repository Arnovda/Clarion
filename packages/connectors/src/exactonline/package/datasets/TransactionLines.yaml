clarion:
  kind: source
  category: Financial
  sync:
    cursor: { field: Modified, type: timestamp }
    requiresSelect: true
  notes: |-
    The general-ledger detail: one row per journal line, across every journal.

    `AmountDC` is the amount in the division currency and is additive; `AmountFC`, `AmountVATBaseFC` and `AmountVATFC` are in the document currency (`Currency`).

    `JournalCode` references Journals by `Code`, not by GUID. `FinancialYear` / `FinancialPeriod` are the POSTING period and `Date` the transaction date; they differ for entries posted into another period, so period reports go by the former.

    `Type` and `Status` are numeric codes (entry type, posting status), not labels.
