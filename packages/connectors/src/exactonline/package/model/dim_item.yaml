# Exact Online star-schema template table. `source` is the DuckDB SQL over BARE source entity names; a foreign key is written ONCE on its field (clarion.references) and the template joins are derived from it.

name: dim_item
label: Items
description: Article master data — what is sold, purchased or stocked.
source: |-
  SELECT
    clarion_key('Items', ID) AS item_key,
    ID                 AS item_id,
    Code               AS item_code,
    Description        AS item_description,
    clarion_key('ItemGroups', ItemGroup) AS item_group_key,
    Unit               AS unit_code,
    IsSalesItem        AS is_sales_item,
    IsStockItem        AS is_stock_item,
    StandardSalesPrice AS standard_sales_price,
    CostPriceStandard  AS cost_price_standard
  FROM Items
fields:
  - name: item_key
    label: Item key
    description: Stable integer key of the item — clarion_key('Items', item_id); every measures table computes the same value from its own column.
    datatype: BIGINT
    clarion: { role: surrogate_key, technical: true, lineage: { dataset: Items, field: ID } }
  - name: item_id
    label: Item ID
    description: ExactOnline item GUID (primary key).
    datatype: VARCHAR
    clarion: { role: natural_key, technical: true, lineage: { dataset: Items, field: ID } }
  - name: item_code
    label: Item code
    description: Article code / SKU.
    datatype: VARCHAR
    clarion: { role: attribute, lineage: { dataset: Items, field: Code } }
  - name: item_description
    label: Item description
    description: Description of the article.
    datatype: VARCHAR
    clarion: { role: attribute, lineage: { dataset: Items, field: Description } }
  - name: item_group_key
    label: Item group
    description: Reporting group of the item.
    datatype: BIGINT
    clarion:
      role: foreign_key
      references: { dataset: dim_item_group, field: item_group_key }
      technical: true
      lineage: { dataset: Items, field: ItemGroup }
  - name: unit_code
    label: Unit
    description: Default unit of measure code.
    datatype: VARCHAR
    clarion: { role: attribute, lineage: { dataset: Items, field: Unit } }
  - name: is_sales_item
    label: Is sales item
    description: True when the item can be sold.
    datatype: BOOLEAN
    clarion: { role: attribute, lineage: { dataset: Items, field: IsSalesItem } }
  - name: is_stock_item
    label: Is stock item
    description: True when stock is tracked for the item.
    datatype: BOOLEAN
    clarion: { role: attribute, lineage: { dataset: Items, field: IsStockItem } }
  - name: standard_sales_price
    label: Standard sales price
    description: Default sales price.
    datatype: DOUBLE
    clarion: { role: attribute, lineage: { dataset: Items, field: StandardSalesPrice } }
  - name: cost_price_standard
    label: Standard cost price
    description: Standard cost price.
    datatype: DOUBLE
    clarion: { role: attribute, lineage: { dataset: Items, field: CostPriceStandard } }
clarion: { kind: dimension, product: Core dimensions, sourceEntities: [ Items ] }
