# Clarion source package — Exact Online. Format: src/sourcePackage/types.ts.
# Curated relationships and the star-schema template live here; each entity is a file under datasets/, each template table under model/.

version: 1
name: exactonline
description: Exact Online — Belgian/Dutch cloud accounting and ERP. REST/OData API, one division per connection.
clarion:
  vendor: { name: Exact Online, docs: https://start.exactonline.nl/docs/HlpRestAPIResources.aspx, transcribed: 2026-07-20 }
  provenance: curated
  fieldCoverage: complete
  categories:
    - CRM
    - Sales
    - Purchase
    - Logistics
    - Inventory
    - Financial
    - Cashflow
    - HRM
    - Project
    - Subscription
    - System
  template:
    version: 2
    products:
      - name: Core dimensions
        description: "Conformed dimensions shared by every ExactOnline data product: accounts, items, GL accounts, journals, payment conditions."
        buildOrder: 1
      - name: Finance
        description: "Accounting analytics: general-ledger detail, open receivables and payables."
        buildOrder: 2
      - name: Sales
        description: "Sales analytics: invoiced revenue and order intake."
        buildOrder: 3
      - name: Purchasing
        description: "Purchasing analytics: orders placed with suppliers, receipt and billing progress."
        buildOrder: 4
  notes: |-
    Amounts: columns ending in `DC` are in the division's default currency and are additive across documents; columns ending in `FC` are in the document currency (`Currency`) and must not be summed across currencies.

    Credit notes are natively NEGATIVE: credit-note lines carry negative quantities and amounts, so a plain SUM is already net. Never add a sign flip.

    Dates arrive as ISO strings (the connector converts OData `/Date()/` epochs at sync time).

    Keys are GUIDs (`ID`), with two lookups the facts reference by CODE rather than GUID: Journals (`Code`) and PaymentConditions (`Code`).
