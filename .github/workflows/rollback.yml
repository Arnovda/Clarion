# Rollback production — one-click "go back to the previous version".
#
# Shifts 100% of traffic back to the revision that was live BEFORE the current
# one (the newest active revision older than the one serving traffic now).
# Use it when a promote turns out to be broken: no rebuild, takes ~30 seconds.
#
# Run it from the GitHub Actions tab → "Rollback production" → Run workflow.
# Running Promote again afterwards returns to the newest version.

name: Rollback production

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which apps to roll back to their previous revision'
        type: choice
        default: 'backend + frontend'
        options:
          - 'backend + frontend'
          - 'backend only'
          - 'frontend only'
      migrations:
        description: 'Also roll back the database migrations the last deploy applied (its last knex batch). Only after traffic is back on the previous revision — the old code must be what runs against the old schema.'
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes — roll back the last migration batch'

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Shift traffic back to the previous revision
        run: |
          set -euo pipefail
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          rollback() {
            local app="$1"
            local current prev
            # Which revision is serving traffic right now?
            current=$(az containerapp ingress traffic show --name "$app" --resource-group "$RG" \
              | jq -r '[.[] | select((.weight // 0) > 0 and .revisionName != null)][0].revisionName // empty')
            if [ -z "$current" ]; then
              current=$(az containerapp show --name "$app" --resource-group "$RG" \
                --query properties.latestReadyRevisionName -o tsv)
            fi
            # Newest active revision that is OLDER than the current one.
            prev=$(az containerapp revision list --name "$app" --resource-group "$RG" \
              | jq -r --arg cur "$current" \
                '[.[] | select(.properties.active == true and .name != $cur)]
                 | sort_by(.properties.createdTime) | last | .name // empty')
            if [ -z "$prev" ]; then
              echo "::error::$app has no previous active revision to roll back to."
              exit 1
            fi
            echo "Rolling back $app: $current → $prev (100% traffic)…"
            az containerapp ingress traffic set \
              --name "$app" --resource-group "$RG" \
              --revision-weight "$prev=100"
            echo "- **$app**: now serving \`$prev\` (was \`$current\`)" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### ⏪ Rolled back" >> "$GITHUB_STEP_SUMMARY"
          case "${{ github.event.inputs.target }}" in
            "backend only")  rollback "${{ secrets.BACKEND_APP_NAME }}" ;;
            "frontend only") rollback "${{ secrets.FRONTEND_APP_NAME }}" ;;
            *)               rollback "${{ secrets.BACKEND_APP_NAME }}"; rollback "${{ secrets.FRONTEND_APP_NAME }}" ;;
          esac
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run **Promote to production** to return to the newest version." >> "$GITHUB_STEP_SUMMARY"

  # ── Migrations (P0-9) ─────────────────────────────────────────────────────
  #
  # `migrate:rollback` undoes the LAST knex batch — exactly what the last
  # deploy's migrate-sql job applied (each deploy is one batch). Every `down`
  # in the tree is exercised on every push by test.yml's migration-rollback
  # job (up → all down → up on a fresh database), so this is a rehearsed path,
  # not a hope. It runs AFTER the traffic shift on purpose: the previous
  # revision is the code written for the previous schema. A `down` that drops
  # a column deletes what that column held since the deploy — the migrate-sql
  # job summary carries the PITR marker for the case that matters.
  rollback-migrations:
    needs: rollback
    if: ${{ startsWith(github.event.inputs.migrations, 'yes') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Roll back the last migration batch
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Before:"; npm run -s migrate:status || true
          npm run migrate:rollback 2>&1 | tee /tmp/rollback.out
          echo "After:"; npm run -s migrate:status || true
          {
            echo "### ⏪ Migrations rolled back"
            echo ""
            echo "$(grep -E 'Batch [0-9]+ rolled back|Already at the base migration' /tmp/rollback.out || cat /tmp/rollback.out)"
            echo ""
            echo "The next push to main re-applies them (migrate-sql runs when a migration file changed); a fixed migration should be a NEW file, never an edit of the one rolled back."
          } >> "$GITHUB_STEP_SUMMARY"
