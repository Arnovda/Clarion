name: Lint

# Lightweight, fast lint gates (ratchets) that always run on PRs + main pushes.
# Independent of the vitest suite. Each guards a specific bug class that has
# bitten us and locks in a fix so it can't regress:
#   • shared-trx-catch   — a defensive `.catch(() => …)` on a Knex query inside
#     the shared request transaction (the May 23 2026 /query 25P02 cascade).
#   • scattered-config    — reading the app URL under FRONTEND_URL /
#     FRONTEND_BASE_URL / PUBLIC_APP_URL instead of config.appUrl (the drift
#     that caused a prod password-reset lockout).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shared-trx-catch:
    name: shared-trx-catch lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # tsx is invoked via npx, which downloads it on demand. No
      # `npm ci` needed — the lint script has zero runtime deps
      # beyond Node's built-in fs/path.
      - name: shared-trx-catch
        run: npx --yes tsx@4.22 backend/scripts/lint-shared-trx-catch.ts

      - name: scattered-config
        run: npx --yes tsx@4.22 backend/scripts/lint-scattered-config.ts
