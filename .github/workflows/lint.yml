name: Lint

# Lightweight, fast lint gates (ratchets) that always run on PRs + main pushes.
# Independent of the vitest suite. Each guards a specific bug class that has
# bitten us and locks in a fix so it can't regress:
#   • shared-trx-catch   — a defensive `.catch(() => …)` on a Knex query inside
#     the shared request transaction (the May 23 2026 /query 25P02 cascade).
#   • scattered-config    — reading the app URL under FRONTEND_URL /
#     FRONTEND_BASE_URL / PUBLIC_APP_URL instead of config.appUrl (the drift
#     that caused a prod password-reset lockout).
#   • no-console          — raw console.* calls in backend/src instead of the
#     structured pino logger (no level/redaction, silently dropped args).
#   • no-internal-dynamic-import — new `await import('./…')` of our own modules
#     (papers over circular dependencies; baseline only ever goes down).
#   • no-inline-500       — inline `res.status(500)` in routes instead of
#     throwing to the central errorHandler (raw-error echo to clients).
#   • validate-coverage   — new mutating routes shipped without the Zod
#     validate() middleware (blind `req.body as {...}` casts; baseline only
#     ever goes down).
#   • contract-sync       — the shared API contract exists as two byte-identical
#     copies (backend/src/shared/contract.ts + frontend/lib/contract.ts, because
#     the frontend Docker build context can't reach a shared package); an edit
#     that lands in only one copy fails here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shared-trx-catch:
    name: shared-trx-catch lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # tsx is invoked via npx, which downloads it on demand. No
      # `npm ci` needed — the lint script has zero runtime deps
      # beyond Node's built-in fs/path.
      - name: shared-trx-catch
        run: npx --yes tsx@4.22 backend/scripts/lint-shared-trx-catch.ts

      - name: scattered-config
        run: npx --yes tsx@4.22 backend/scripts/lint-scattered-config.ts

      - name: no-console
        run: npx --yes tsx@4.22 backend/scripts/lint-no-console.ts

      - name: no-internal-dynamic-import
        run: npx --yes tsx@4.22 backend/scripts/lint-no-internal-dynamic-import.ts

      - name: no-inline-500
        run: npx --yes tsx@4.22 backend/scripts/lint-no-inline-500.ts

      - name: validate-coverage
        run: npx --yes tsx@4.22 backend/scripts/lint-validate-coverage.ts

      - name: contract-sync
        run: npx --yes tsx@4.22 backend/scripts/lint-contract-sync.ts

      # Tenant context must be TRANSACTION-LOCAL: no session-level SET on the
      # shared pool anywhere outside the allowlisted request fallback, and the
      # count of bare-pool semanticDb('…') queries outside routes/ only goes
      # down (P0-5 of the 2026-09-05 assessment — the jobs-worker runs jobs
      # from different tenants concurrently on one pool).
      - name: no-session-tenant-set
        run: npx --yes tsx@4.22 backend/scripts/lint-no-session-tenant-set.ts
