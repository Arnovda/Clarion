name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: databridge
          POSTGRES_PASSWORD: databridge
          POSTGRES_DB: databridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://databridge:databridge@localhost:5432/databridge_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      NEO4J_URI: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: npx knex --knexfile knexfile.ts migrate:latest

      - name: Security audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Security audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true  # frontend deps often have non-exploitable advisories

      - name: Run tests
        working-directory: backend
        run: npx vitest run
