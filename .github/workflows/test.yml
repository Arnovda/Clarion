name: Tests

# Re-enabled 2026-07-11: the vitest suite is green (91/91). Runs on every PR
# and push to main. The suite uses a Postgres service container; Neo4j is
# disabled (NEO4J_URI="") and rate limiters/AI are skipped under VITEST.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: databridge
          POSTGRES_PASSWORD: databridge
          POSTGRES_DB: databridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://databridge:databridge@localhost:5432/databridge_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      NEO4J_URI: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The backend depends on @databridge/connectors via file:../packages/connectors,
      # whose compiled dist/ is gitignored. Build it first (mirrors the backend
      # Dockerfile) so backend `npm ci` links a package that actually has types +
      # runtime output — otherwise the typecheck and tests fail to resolve it.
      - name: Build connectors package
        working-directory: packages/connectors
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The RLS runtime role is provisioned out-of-band in dev/prod (see
      # docs/runbooks/db-role-flip.md), so the fresh CI Postgres doesn't have
      # it — but several migrations GRANT to it. Create it idempotently before
      # migrating. Tests still connect as the superuser (DATABASE_URL above);
      # the role only needs to EXIST for the GRANTs to succeed.
      - name: Create RLS app role
        env:
          PGPASSWORD: databridge
        run: |
          psql -h localhost -U databridge -d databridge_test -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='databridge_app') THEN CREATE ROLE databridge_app WITH LOGIN PASSWORD 'databridge' NOBYPASSRLS; END IF; END \$\$;"

      - name: Run migrations
        working-directory: backend
        run: npx knex --knexfile knexfile.ts migrate:latest

      # Security audits now GATE. They were advisory (`continue-on-error`)
      # while a dependency backlog was triaged; the backlog reached 58
      # advisories instead, so the promise to re-tighten is kept here.
      #
      # The gate fails on any high/critical that is not explicitly exempted
      # in scripts/audit-gate.mjs, where every exemption carries its reason.
      # Plain `npm audit --audit-level=high` cannot be used directly: the
      # duckdb native-build toolchain has unfixable advisories that would
      # keep it permanently red, which is how it ended up ignored before.
      # Each workspace is gated in the job that already installed it —
      # frontend in widget-render-gate, connectors in connector-tests.
      - name: Security audit gate (backend)
        run: node scripts/audit-gate.mjs backend

      # Strict type-check gate so a broken build doesn't slip past PR review.
      # tsconfig.build.json is what the prod Docker image compiles with —
      # using it here catches issues that the looser dev tsconfig hides.
      - name: Type-check backend (strict)
        working-directory: backend
        run: npx tsc --project tsconfig.build.json --noEmit

      # Holds the precondition for tenant-scoping the graph: a node that is
      # written without tenantId is invisible to a tenant-scoped read, which
      # fails as an empty catalog rather than an error. No test would catch it.
      - name: Graph tenant-stamp lint
        run: npx tsx backend/scripts/lint-graph-tenant-stamp.ts

      # The other half of the same invariant: every MATCH on a tenant-owned
      # label in semanticGraph.ts must carry a tenantId predicate, so a new
      # query cannot quietly read across tenants again (the P0-2 finding).
      - name: Graph tenant-predicate lint
        run: npx tsx backend/scripts/lint-graph-tenant-predicate.ts

      - name: Run tests
        working-directory: backend
        run: npx vitest run

  # Tenant-isolation gate. `e2e/rls.spec.ts` registers two tenants over the
  # real API and asserts that neither can see the other's rows — the property
  # the whole multi-tenant model rests on.
  #
  # This spec existed since the RLS work but was never wired into CI, so it
  # had rotted: three of its four tests guarded their assertions behind
  # conditions that were always false and passed green while checking nothing
  # (see the note at the top of the spec). Both were fixed together — running
  # a dead suite would have been worse than not running it.
  #
  # THE ROLE MATTERS. The backend connects as `databridge_app`
  # (NOBYPASSRLS) here, NOT the `databridge` superuser used for migrations:
  # a superuser bypasses row-level security unconditionally, so pointing the
  # API at it would make every assertion below pass without RLS being
  # enforced at all. Keep these two URLs distinct.
  rls-isolation:
    name: Tenant Isolation (RLS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: databridge
          POSTGRES_PASSWORD: databridge
          POSTGRES_DB: databridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same reason as the api-tests job: the backend resolves
      # @databridge/connectors from a gitignored dist/.
      - name: Build connectors package
        working-directory: packages/connectors
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Create RLS app role
        env:
          PGPASSWORD: databridge
        run: |
          psql -h localhost -U databridge -d databridge_test -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='databridge_app') THEN CREATE ROLE databridge_app WITH LOGIN PASSWORD 'databridge' NOBYPASSRLS; END IF; END \$\$;"

      # Migrations run as the superuser. They GRANT to databridge_app, but only
      # for tables created from migration 41 onward — everything older (users,
      # tenants, connections, dashboards, …) is granted out-of-band per
      # docs/runbooks/db-role-flip.md. A database provisioned purely from
      # migrations therefore leaves the app role unable to read `users`, which
      # is what this job first surfaced: registration 500'd with
      # "permission denied for table users".
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://databridge:databridge@localhost:5432/databridge_test
        run: npx knex --knexfile knexfile.ts migrate:latest

      # Reproduce the out-of-band grants so CI matches a real deployment.
      # Deliberately NOT NOCREATEROLE/BYPASSRLS — the role stays NOBYPASSRLS,
      # which is the whole point of this job. Grants and RLS are orthogonal:
      # this lets the role reach the tables, RLS still decides which rows.
      - name: Grant the app role its table privileges
        env:
          PGPASSWORD: databridge
        run: |
          psql -h localhost -U databridge -d databridge_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE databridge_test TO databridge_app;
          GRANT USAGE ON SCHEMA public TO databridge_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO databridge_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO databridge_app;
          SQL

      # Proves the preflight itself works, against a database that has the role,
      # the policies and the grants. It is the gate the production role flip
      # runs before it will touch anything, so it must not be the one thing in
      # that path that has never executed.
      - name: Role-flip preflight (must report GO)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://databridge:databridge@localhost:5432/databridge_test
        run: npx tsx scripts/preflight-role-flip.ts

      - name: Start backend as the RLS-bound role
        working-directory: backend
        env:
          DATABASE_URL: postgresql://databridge_app:databridge@localhost:5432/databridge_test
          JWT_SECRET: ci-rls-secret
          CREDENTIALS_ENCRYPTION_KEY: ci-rls-encryption-key
          # NODE_ENV=test disables the rate limiters — the spec registers two
          # tenants back to back and would otherwise trip the auth limiter.
          NODE_ENV: test
          NEO4J_URI: ""
          RUN_SCHEDULERS: "false"
          PORT: "3001"
        run: |
          npm run dev > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          cat /tmp/backend.log >&2
          exit 1

      - name: Install Playwright
        run: npm ci

      # The specs drive the API through Playwright's `request` fixture and
      # never open a page, so no browser download is needed.
      #
      # auth-login.spec.ts is the login half of the gate: this job is the one
      # environment where the backend runs as `databridge_app` against a
      # migration-only database, and rls.spec.ts only ever uses the token
      # /register returns — so a schema in which login itself cannot work
      # (the P0-1 auth_lookup gap) passed this job for weeks. It logs in.
      - name: Run RLS isolation + auth flow tests
        env:
          RLS_SOURCE_PGDATABASE: databridge_test
          RLS_SOURCE_PGUSER: databridge
          RLS_SOURCE_PGPASSWORD: databridge
        run: npx playwright test e2e/rls.spec.ts e2e/auth-login.spec.ts

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/backend.log

  # Connector-framework unit tests (no database needed). Includes the
  # DuckDB-backed Parquet round-trip tests, which run fine on Linux CI.
  connector-tests:
    name: Connector Framework Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/connectors/package-lock.json
      - name: Install connector dependencies
        working-directory: packages/connectors
        run: npm ci
      - name: Type-check connectors
        working-directory: packages/connectors
        run: npm run check
      - name: Security audit gate (connectors)
        run: node scripts/audit-gate.mjs packages/connectors
      - name: Run connector tests
        working-directory: packages/connectors
        run: npx vitest run

  # Widget render gate — the institutionalised Vega lesson (see
  # docs/backlog/dashboard-architecture-plan.md §2 item 17). Renders every
  # dashboard widget type against fixture rows in REAL Chromium and fails if
  # any type draws no marks, errors, or is missing from the /dev/widgets
  # gallery. Headless spec-level checks demonstrably do NOT catch blank
  # charts; this does.
  # P1-7: a frontend type error could reach production — next.config.mjs
  # sets ignoreBuildErrors (so `next build` compiles type errors into the
  # Docker image), and none of the other jobs type-checked the frontend.
  # The deploy gate waits on this WORKFLOW succeeding for the commit, so
  # this job is what finally blocks the deploy. It also runs the frontend
  # unit tests (vitest + Testing Library) — the first ones the app has.
  # Reproduced red before adding: `next build` exited 0 with a deliberate
  # `const x: number = 'string'` in a page, while `tsc --noEmit` caught it.
  frontend-checks:
    name: Frontend type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend (strict — next build does not)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend unit tests
        working-directory: frontend
        run: npx vitest run

  widget-render-gate:
    name: Widget Render Gate (real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Security audit gate (frontend)
        run: node scripts/audit-gate.mjs frontend
      - name: Build frontend (production)
        working-directory: frontend
        run: npx next build
      - name: Install Playwright + Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start frontend and wait for it
        working-directory: frontend
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/dev/widgets >/dev/null && exit 0
            sleep 2
          done
          echo "frontend did not become ready" >&2; exit 1
      - name: Run widget render smoke test
        run: npx playwright test e2e/widgets.spec.ts
