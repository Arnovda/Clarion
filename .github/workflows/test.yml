name: Tests

# Re-enabled 2026-07-11: the vitest suite is green (91/91). Runs on every PR
# and push to main. The suite uses a Postgres service container; Neo4j is
# disabled (NEO4J_URI="") and rate limiters/AI are skipped under VITEST.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: databridge
          POSTGRES_PASSWORD: databridge
          POSTGRES_DB: databridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://databridge:databridge@localhost:5432/databridge_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      NEO4J_URI: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The backend depends on @databridge/connectors via file:../packages/connectors,
      # whose compiled dist/ is gitignored. Build it first (mirrors the backend
      # Dockerfile) so backend `npm ci` links a package that actually has types +
      # runtime output — otherwise the typecheck and tests fail to resolve it.
      - name: Build connectors package
        working-directory: packages/connectors
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The RLS runtime role is provisioned out-of-band in dev/prod (see
      # docs/runbooks/db-role-flip.md), so the fresh CI Postgres doesn't have
      # it — but several migrations GRANT to it. Create it idempotently before
      # migrating. Tests still connect as the superuser (DATABASE_URL above);
      # the role only needs to EXIST for the GRANTs to succeed.
      - name: Create RLS app role
        env:
          PGPASSWORD: databridge
        run: |
          psql -h localhost -U databridge -d databridge_test -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='databridge_app') THEN CREATE ROLE databridge_app WITH LOGIN PASSWORD 'databridge' NOBYPASSRLS; END IF; END \$\$;"

      - name: Run migrations
        working-directory: backend
        run: npx knex --knexfile knexfile.ts migrate:latest

      # Security audits are advisory, not gating: the known dependency backlog
      # (tracked as audit item B3) would otherwise fail every run. They surface
      # in the log; they don't block the test gate. Re-tighten to gating once
      # the backlog is triaged.
      - name: Security audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Security audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      # Strict type-check gate so a broken build doesn't slip past PR review.
      # tsconfig.build.json is what the prod Docker image compiles with —
      # using it here catches issues that the looser dev tsconfig hides.
      - name: Type-check backend (strict)
        working-directory: backend
        run: npx tsc --project tsconfig.build.json --noEmit

      - name: Run tests
        working-directory: backend
        run: npx vitest run

  # Connector-framework unit tests (no database needed). Includes the
  # DuckDB-backed Parquet round-trip tests, which run fine on Linux CI.
  connector-tests:
    name: Connector Framework Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/connectors/package-lock.json
      - name: Install connector dependencies
        working-directory: packages/connectors
        run: npm ci
      - name: Type-check connectors
        working-directory: packages/connectors
        run: npm run check
      - name: Run connector tests
        working-directory: packages/connectors
        run: npx vitest run

  # Widget render gate — the institutionalised Vega lesson (see
  # docs/backlog/dashboard-architecture-plan.md §2 item 17). Renders every
  # dashboard widget type against fixture rows in REAL Chromium and fails if
  # any type draws no marks, errors, or is missing from the /dev/widgets
  # gallery. Headless spec-level checks demonstrably do NOT catch blank
  # charts; this does.
  widget-render-gate:
    name: Widget Render Gate (real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend (production)
        working-directory: frontend
        run: npx next build
      - name: Install Playwright + Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start frontend and wait for it
        working-directory: frontend
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/dev/widgets >/dev/null && exit 0
            sleep 2
          done
          echo "frontend did not become ready" >&2; exit 1
      - name: Run widget render smoke test
        run: npx playwright test e2e/widgets.spec.ts
