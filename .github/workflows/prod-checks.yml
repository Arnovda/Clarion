# Production checks — is the database role flip safe to perform?
#
#   .ops/prod-checks   contains   `report`
#
# The check needs production credentials, which live here as GitHub secrets and
# nowhere else. Running it from a laptop would mean handing those secrets to a
# person; running it here means the answer is a workflow log anyone on the team
# can read. That is the whole reason this exists rather than a runbook paragraph
# telling someone to connect to production and run a script.
#
# Read-only, and it reads no business data — only the PostgreSQL catalog.
#
# This workflow used to carry a second check: whether every Neo4j node carries a
# `tenantId`. It never once ran. Neo4j has `external_enabled = false`, so no
# GitHub runner can reach it, and the step reported "COULD NOT RUN" on every
# invocation — a check that cannot fail and cannot pass is not a check. It moved
# to `.ops/graph-backfill`, which runs it as a Container Apps Job INSIDE the
# environment, where Neo4j is reachable without opening anything up.

name: Production checks

on:
  push:
    branches: [main]
    paths:
      - '.ops/prod-checks'
  workflow_dispatch:

concurrency:
  group: prod-checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read mode
        id: mode
        run: |
          set -euo pipefail
          MODE=$(grep -vE '^[[:space:]]*(#|$)' .ops/prod-checks | head -1 | tr -d '[:space:]')
          case "$MODE" in
            report) ;;
            *) echo "::error::invalid mode '$MODE' (expected 'report'). The graph check moved to .ops/graph-backfill."; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      # The backend package is what the script imports (knex, pg).
      # --ignore-scripts skips the duckdb native build, which it does not need.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      # Runs with the ADMIN url on purpose: it inspects the catalog, and asking
      # the app role whether it has permission is the very thing that may be
      # broken. Never fails the job — a NO-GO is a finding to read, not a broken
      # build.
      - name: Role-flip preflight
        id: preflight
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          npx tsx scripts/preflight-role-flip.ts 2>&1 | tee /tmp/preflight.txt

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
        run: |
          {
            echo "## Production checks"
            echo ""
            echo "### Role-flip preflight"
            if [ "$PREFLIGHT" = "success" ]; then
              echo "**GO** — the backend can run as \`databridge_app\` with row-level security enforced."
              echo ""
              echo "To flip: set \`.ops/db-role\` to \`app\` and push. No secret is needed —"
              echo "the workflow generates the role's password, sets it, and verifies it can read."
            else
              echo "**NO-GO** — blockers below. Do not flip \`.ops/db-role\`."
            fi
            echo ""
            echo '```'
            cat /tmp/preflight.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo ""
            echo "### Graph tenant stamping"
            echo "Moved to \`.ops/graph-backfill\` — it runs as a Container Apps Job inside the"
            echo "environment, because Neo4j has \`external_enabled = false\` and no GitHub runner"
            echo "can reach it."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "preflight=$PREFLIGHT"
