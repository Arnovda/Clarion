# CI/CD — Build, push to ACR, deploy to Azure Container Apps
#
# Fast + surgical:
#   • Only the services whose files changed are built/deployed (paths-filter).
#     A frontend-only push skips the backend / ETL / worker builds, the SQL
#     migration, and the Neo4j step entirely.
#   • Docker layer caching (type=gha) makes every build incremental — npm ci /
#     next build / pip install are reused unless their inputs change.
#
# Deploy model (see docs/DEV_FLOW.md):
#   • Push to main → the TESTS MUST PASS (`gate`), then build (cached), run
#     migrations (only if a migration file changed), deploy backend + frontend
#     as NEW revisions at 0% TRAFFIC, and finally `promote` shifts traffic to
#     them once the new backend answers /api/health through its staging label.
#     The staging URLs (https://<app>---staging.<env-domain>, printed in the
#     job summary) stay available for looking at a build yourself.
#   • What keeps automatic promotion honest is that a user-visible change ships
#     behind a feature flag that is OFF, so reaching production is not the same
#     as reaching a customer — the audience is chosen on the "Who sees what"
#     screen. "Rollback production" shifts traffic back if needed, and
#     "Promote to production" remains as a manual override.
#
# IMPORTANT: migrations must stay backward-compatible (additive: CREATE/ADD,
# never DROP/RENAME in the same deploy) — the 0%-traffic revision shares the DB
# with the live one during the test window.
#
# Required GitHub secrets: AZURE_CREDENTIALS, ACR_LOGIN_SERVER, ACR_USERNAME,
# ACR_PASSWORD, AZURE_RESOURCE_GROUP, BACKEND_APP_NAME, FRONTEND_APP_NAME,
# ETL_APP_NAME, DATABASE_URL, NEO4J_URI, NEO4J_PASSWORD, PROD_API_URL,
# STAGING_API_URL.

name: Build & Deploy

on:
  push:
    branches: [main, staging]
  # Manual redeploy. A component is only built when its own paths changed, so a
  # deploy that FAILS leaves that component stale indefinitely — every later
  # commit that touches something else skips it, and the app keeps serving the
  # last image that made it through. That is not hypothetical: the frontend sat
  # two commits behind for exactly this reason. This is how you get it current
  # again without inventing a commit.
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and redeploy these regardless of what changed'
        type: choice
        default: 'frontend + backend'
        options:
          - 'frontend + backend'
          - 'frontend only'
          - 'backend only'

# Deploys of different commits must not overlap. Azure locks a container app
# while it provisions a revision, so a second deploy arriving mid-flight fails
# with ContainerAppOperationInProgress — which is exactly what three pushes
# inside two minutes produced. Queue them instead of cancelling: a cancelled
# deploy can stop between `az containerapp update` and the label move, leaving
# the staging label pointing at the wrong revision.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:

  # ── Tests must pass before ANYTHING touches production ────────────────────
  #
  # test.yml and deploy.yml both trigger on a push to main, and until now they
  # simply raced: a commit with a failing test still built, still migrated the
  # database and still produced a deployable revision. The only thing between a
  # red suite and customers was whether a human happened to look at the Actions
  # tab. That was tolerable while every change went through a reviewed PR. It is
  # not tolerable now that pushes land on main directly and promotion is
  # automatic, so this job is the gate that replaces the human.
  #
  # It gates `migrate-sql` and `deploy` only, NOT the image builds. Builds are
  # side-effect free — an image nobody deploys costs a few runner-minutes — so
  # letting them run alongside the suite keeps the deploy fast without letting
  # anything reach production early.
  #
  # A workflow_dispatch run is a manual redeploy of an already-tested commit
  # (see the `force` input), so it does not wait.
  gate:
    name: Tests must pass
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Explicit, because the default GITHUB_TOKEN permission set is a repo/org
    # setting. If reading Actions were denied the gate would error and block
    # every deploy — a safe failure, but a baffling one.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the Tests workflow to succeed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # NO RUN AT ALL is a failure, not a pass. "Tests did not run" and
          # "tests passed" must never be the same outcome — that conflation is
          # exactly how a red suite reaches production unnoticed.
          deadline_no_run=$(( SECONDS + 300 ))
          deadline_total=$(( SECONDS + 1800 ))

          while : ; do
            RUN=$(gh api \
              "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status)|\(.conclusion // "")|\(.html_url)"' 2>/dev/null || echo "")

            if [ -z "$RUN" ] || [ "$RUN" = "null||" ]; then
              if [ "$SECONDS" -gt "$deadline_no_run" ]; then
                echo "::error::No Tests run found for $SHA after 5 minutes. Refusing to deploy an untested commit."
                exit 1
              fi
              echo "waiting for the Tests workflow to appear..."
              sleep 15
              continue
            fi

            STATUS="${RUN%%|*}"
            REST="${RUN#*|}"
            CONCLUSION="${REST%%|*}"
            URL="${REST#*|}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Tests passed: $URL"
                echo "### ✅ Tests passed — deploying" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error::Tests concluded '$CONCLUSION' for $SHA — not deploying. $URL"
              {
                echo "### ❌ Not deployed — the tests did not pass"
                echo ""
                echo "Nothing reached production. Fix the failure and push again."
                echo ""
                echo "[See what failed]($URL)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "$SECONDS" -gt "$deadline_total" ]; then
              echo "::error::Tests still '$STATUS' after 30 minutes. Refusing to deploy without a result. $URL"
              exit 1
            fi
            echo "tests $STATUS — waiting..."
            sleep 15
          done
  # ── Detect which areas changed ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend == 'true' || contains(inputs.force, 'frontend') }}
      backend: ${{ steps.f.outputs.backend == 'true' || contains(inputs.force, 'backend') }}
      etl: ${{ steps.f.outputs.etl }}
      worker: ${{ steps.f.outputs.worker }}
      migrations: ${{ steps.f.outputs.migrations }}
      neo4j: ${{ steps.f.outputs.neo4j }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            frontend:
              - 'frontend/**'
            etl:
              - 'etl/**'
            backend:
              - 'backend/**'
              - 'packages/connectors/**'
            worker:
              - 'worker/**'
              - 'packages/connectors/**'
            migrations:
              - 'backend/src/db/migrations/**'
            neo4j:
              - 'backend/src/db/neo4j.ts'

  # ── Builds (each gated to its service; all layer-cached) ──────────────────
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-frontend:${{ github.ref_name }}-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref_name == 'main' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ./etl
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-etl:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-etl:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=etl
          cache-to: type=gha,mode=max,scope=etl

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-backend:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-backend:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-sync-worker:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-sync-worker:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ── SQL migrations (only when a migration file changed) ───────────────────
  migrate-sql:
    needs: [changes, gate, build-backend]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run Knex migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:latest

  # ── Deploy changed services as 0%-traffic revisions ───────────────────────
  deploy:
    needs: [changes, gate, build-frontend, build-etl, build-backend, build-worker, migrate-sql]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.etl == 'true' || needs.changes.outputs.worker == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Backend + frontend land as NEW revisions at 0% traffic. We deliberately
      # do NOT shift traffic — the live revision keeps serving until you run the
      # "Promote to production" workflow. `revision set-mode multiple` is
      # idempotent and required for 0%-traffic revisions.
      #
      # Two invariants each deploy step maintains:
      #   1. Traffic is pinned to the CURRENTLY-LIVE revision BY NAME before the
      #      new revision is created. If traffic were assigned to "latest"
      #      (which the old promote did), Azure auto-shifts 100% to every new
      #      revision the moment it deploys — i.e. pushes would go straight to
      #      production and the test-first model silently breaks.
      #   2. The fixed "staging" label is moved to the new revision, so the test
      #      URL (https://<app>---staging.<env-domain>) never changes and can be
      #      bookmarked.
      - name: Deploy backend (test revision, 0% traffic)
        if: needs.changes.outputs.backend == 'true'
        env:
          APP: ${{ secrets.BACKEND_APP_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          az containerapp revision set-mode \
            --name "$APP" --resource-group "$RG" --mode multiple || true

          LIVE=$(az containerapp ingress traffic show --name "$APP" --resource-group "$RG" \
            | jq -r '[.[] | select((.weight // 0) > 0 and .revisionName != null)][0].revisionName // empty')
          if [ -z "$LIVE" ]; then
            LIVE=$(az containerapp show --name "$APP" --resource-group "$RG" \
              --query properties.latestReadyRevisionName -o tsv)
          fi
          if [ -n "$LIVE" ]; then
            az containerapp ingress traffic set --name "$APP" --resource-group "$RG" \
              --revision-weight "$LIVE=100"
          fi

          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image ${{ env.ACR_REGISTRY }}/databridge-backend:$TAG \
            --revision-suffix "$TAG"

          az containerapp revision label remove --name "$APP" --resource-group "$RG" \
            --label staging || true
          # --yes is REQUIRED: when the label is already attached to another
          # revision, `label add` asks to confirm the move. On a runner there is
          # no TTY, so az raises NoTTYException and the whole deploy fails. The
          # `label remove` above does not make this safe — a concurrent deploy
          # can re-attach the label between the two calls.
          az containerapp revision label add --name "$APP" --resource-group "$RG" \
            --label staging --revision "$APP--$TAG" --yes

          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          {
            echo "### 🧪 Backend built and deployed (traffic not shifted yet)";
            echo "Fixed test API URL: \`https://${FQDN/./---staging.}/api\`";
            echo "";
            echo "The **Go live** job promotes this automatically once it answers /api/health.";
          } >> "$GITHUB_STEP_SUMMARY"

      # The jobs-worker runs the SAME image as the backend with ROLE=worker.
      # It has no ingress and no traffic split, so there is nothing to promote —
      # it just takes the new image directly. Skipped silently until the app
      # exists (it is created by `terraform apply`, which is a manual step), so
      # this is safe to merge before the infra lands.
      #
      # Pinning the immutable per-commit tag matters here for the same reason it
      # does for the sync-worker job: a mutable :main-latest tag can be served
      # from a cached image, leaving background work running old code while
      # every build reports success.
      - name: Deploy jobs-worker
        if: needs.changes.outputs.backend == 'true'
        env:
          APP: ${{ secrets.BACKEND_APP_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          WORKER_APP="${APP%-backend}-jobs-worker"
          if ! az containerapp show --name "$WORKER_APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "::notice::$WORKER_APP does not exist yet (run terraform apply to create it) — skipping."
            exit 0
          fi
          az containerapp update \
            --name "$WORKER_APP" \
            --resource-group "$RG" \
            --image ${{ env.ACR_REGISTRY }}/databridge-backend:$TAG
          echo "### ⚙️ jobs-worker updated to \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy frontend (test revision, 0% traffic)
        if: needs.changes.outputs.frontend == 'true'
        env:
          APP: ${{ secrets.FRONTEND_APP_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          az containerapp revision set-mode \
            --name "$APP" --resource-group "$RG" --mode multiple || true

          LIVE=$(az containerapp ingress traffic show --name "$APP" --resource-group "$RG" \
            | jq -r '[.[] | select((.weight // 0) > 0 and .revisionName != null)][0].revisionName // empty')
          if [ -z "$LIVE" ]; then
            LIVE=$(az containerapp show --name "$APP" --resource-group "$RG" \
              --query properties.latestReadyRevisionName -o tsv)
          fi
          if [ -n "$LIVE" ]; then
            az containerapp ingress traffic set --name "$APP" --resource-group "$RG" \
              --revision-weight "$LIVE=100"
          fi

          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image ${{ env.ACR_REGISTRY }}/databridge-frontend:$TAG \
            --revision-suffix "$TAG"

          az containerapp revision label remove --name "$APP" --resource-group "$RG" \
            --label staging || true
          # --yes is REQUIRED: when the label is already attached to another
          # revision, `label add` asks to confirm the move. On a runner there is
          # no TTY, so az raises NoTTYException and the whole deploy fails. The
          # `label remove` above does not make this safe — a concurrent deploy
          # can re-attach the label between the two calls.
          az containerapp revision label add --name "$APP" --resource-group "$RG" \
            --label staging --revision "$APP--$TAG" --yes

          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          {
            echo "### 🧪 Frontend built and deployed (traffic not shifted yet)";
            echo "Fixed test URL (bookmark this): \`https://${FQDN/./---staging.}\`";
            echo "";
            echo "This URL always shows the newest pushed version.";
            echo "The **Go live** job promotes it automatically once the backend is healthy.";
          } >> "$GITHUB_STEP_SUMMARY"

      # ETL is internal plumbing (backend calls it) and stays auto-live on
      # deploy. Backward-compatible changes only (same rule as migrations).
      - name: Deploy ETL
        if: needs.changes.outputs.etl == 'true'
        run: |
          az containerapp update \
            --name ${{ secrets.ETL_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/databridge-etl:${{ steps.tag.outputs.tag }}

      # Sync-worker Job: pin the Job to THIS build's immutable per-commit tag.
      # The Job used to reference the mutable `:main-latest` tag on the theory
      # that every execution re-pulls it — but Azure Container Apps serves
      # job executions from a node-local image cache, so a mutable tag can
      # keep running STALE worker code indefinitely (this shipped the
      # 2026-07-20 typed-writes fix into ACR while production syncs kept
      # executing the old image). An explicit `job update --image <sha-tag>`
      # changes the job spec, which forces a real pull on the next execution.
      # The job name follows the same Terraform naming rule as the backend
      # app: <project>-<env>-backend → <project>-<env>-sync-worker.
      - name: Pin sync-worker job to this build
        if: needs.changes.outputs.worker == 'true'
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TAG: ${{ steps.tag.outputs.tag }}
          BACKEND_APP: ${{ secrets.BACKEND_APP_NAME }}
        run: |
          set -euo pipefail
          JOB="${BACKEND_APP%-backend}-sync-worker"
          az containerapp job update \
            --name "$JOB" \
            --resource-group "$RG" \
            --image ${{ env.ACR_REGISTRY }}/databridge-sync-worker:$TAG
          echo "### 🔧 Sync-worker pinned to \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The next sync run pulls exactly this build — no stale-cache risk." >> "$GITHUB_STEP_SUMMARY"

  # ── Go live, once the new revision proves it works ────────────────────────
  #
  # Replaces the manual "Promote to production" click. The click existed so a
  # human could look at the staging URL before customers saw anything; this job
  # keeps the check and drops the waiting. What makes that a fair trade is the
  # rest of the machinery, not optimism:
  #
  #   • the suite gated this deploy (see `gate`)
  #   • the revision has to boot AND answer /api/health before traffic moves
  #   • user-visible changes ship behind a feature flag that is OFF, so being
  #     in production is not the same as being visible to a customer
  #   • "Rollback production" is still one click
  #
  # The health check is the load-bearing part. `Provisioned` only means Azure
  # started the container; a revision that boots and then 500s on every request
  # is Provisioned too. Hitting the real endpoint through the staging label is
  # the same thing a person did by eye, done reliably.
  promote:
    name: Go live
    needs: [changes, deploy]
    if: ${{ !cancelled() && !failure() && github.ref_name == 'main' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Health-check the new backend, then shift traffic
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          BACKEND: ${{ secrets.BACKEND_APP_NAME }}
          FRONTEND: ${{ secrets.FRONTEND_APP_NAME }}
          TAG: ${{ steps.tag.outputs.tag }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail

          # Wait for a revision to be Provisioned. Azure reports Failed and
          # Degraded as terminal, so those stop the promotion immediately
          # rather than burning the full timeout.
          wait_provisioned() {
            local app="$1" rev="$2" state
            for _ in $(seq 1 40); do
              state=$(az containerapp revision show --name "$app" --resource-group "$RG" \
                --revision "$rev" --query properties.provisioningState -o tsv 2>/dev/null || echo "")
              case "$state" in
                Provisioned) return 0 ;;
                Failed|Degraded)
                  echo "::error::$app revision $rev is $state — not promoting."
                  return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$app revision $rev never reached Provisioned."
            return 1
          }

          # Shift ALL traffic to one named revision. Never `latest=100`: a
          # traffic entry pinned to "latest" auto-follows every future
          # revision, which would make the next push go live before this job
          # ever got a say.
          shift_traffic() {
            local app="$1" rev="$2" attempt
            # Azure locks the app while a revision provisions, so a promote
            # arriving too soon fails with ContainerAppOperationInProgress.
            for attempt in $(seq 1 15); do
              if az containerapp ingress traffic set --name "$app" --resource-group "$RG" \
                   --revision-weight "$rev=100" >/dev/null 2>&1; then
                echo "$app -> $rev at 100%"
                return 0
              fi
              sleep 20
            done
            echo "::error::could not shift traffic on $app after 5 minutes."
            return 1
          }

          BACKEND_REV="$BACKEND--$TAG"
          FRONTEND_REV="$FRONTEND--$TAG"

          if [ "$BACKEND_CHANGED" = "true" ]; then
            wait_provisioned "$BACKEND" "$BACKEND_REV"

            # The real smoke test: ask the NEW revision, through its staging
            # label, whether it is actually serving. A revision can be
            # Provisioned and still fail every request. Since P0-6 this is a
            # DEEP check — Postgres, Redis, Neo4j, blob and whether anything
            # listens on the job queues — so a revision with a dead dependency
            # can no longer take traffic on a Postgres-only 200. The body
            # names the failing component, so echo it: "503" alone made the
            # first diagnosis a log-diving exercise.
            FQDN=$(az containerapp show --name "$BACKEND" --resource-group "$RG" \
              --query properties.configuration.ingress.fqdn -o tsv)
            HEALTH="https://${FQDN/./---staging.}/api/health"

            OK=""
            BODY=""
            for _ in $(seq 1 20); do
              CODE=$(curl -sS -o /tmp/health-body -w '%{http_code}' -m 15 "$HEALTH" || echo 000)
              BODY=$(cat /tmp/health-body 2>/dev/null || true)
              echo "  health $HEALTH -> $CODE ${BODY:+· $BODY}"
              if [ "$CODE" = "200" ]; then OK=1; break; fi
              sleep 10
            done
            if [ -z "$OK" ]; then
              echo "::error::the new backend never answered 200 on /api/health — leaving traffic where it is. Last body: ${BODY:-none}"
              {
                echo "### 🛑 Not promoted — the new version did not come up healthy"
                echo ""
                echo "Your customers are still on the previous version. Nothing changed for them."
                echo ""
                echo "Last health answer: \`${BODY:-no response body}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            shift_traffic "$BACKEND" "$BACKEND_REV"
          fi

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            wait_provisioned "$FRONTEND" "$FRONTEND_REV"
            shift_traffic "$FRONTEND" "$FRONTEND_REV"
          fi

          # The audience decision is the other half of a release and does NOT
          # happen here: one revision serves every tenant, so promoting is
          # all-or-nothing by construction. Link straight to the picker — a
          # feature that reaches production and then sits switched off because
          # nothing said it was waiting is the failure this line exists to stop.
          FRONTEND_FQDN=$(az containerapp show \
            --name "$FRONTEND" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || true)
          {
            echo "### 🚀 Live"
            echo ""
            echo "This build is now serving customers."
            echo ""
            if [ -n "$FRONTEND_FQDN" ]; then
              echo "- New features ship switched **off**. **[Choose who sees them →](https://$FRONTEND_FQDN/admin/features)**"
            else
              echo "- New features ship switched **off**. Open **Settings → Who sees what** to choose who gets them."
            fi
            echo "- Something wrong? Actions → **Rollback production** → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Neo4j constraints (only when neo4j.ts itself changed; idempotent) ─────
  # This job consistently takes ~7 minutes (slow connection to the Neo4j
  # Container App) and the backend also ensures constraints at startup, so it
  # only runs when the constraint definitions could actually have changed —
  # i.e. when backend/src/db/neo4j.ts was touched. This cuts a typical deploy
  # from ~13 min to ~6 min of wall clock.
  neo4j-constraints:
    needs: [changes, deploy]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.neo4j == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Ensure Neo4j constraints
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: neo4j
        run: |
          node -e "
            require('ts-node/register');
            const { ensureNeo4jConstraints, closeDriver } = require('./src/db/neo4j');
            ensureNeo4jConstraints()
              .then(() => closeDriver())
              .then(() => { console.log('Neo4j constraints OK'); process.exit(0); })
              .catch(e => { console.error('Neo4j constraint error:', e.message); process.exit(1); });
          "
