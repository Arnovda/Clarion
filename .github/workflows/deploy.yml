# CI/CD — Build, push to ACR, deploy to Azure Container Apps
#
# Fast + surgical:
#   • Only the services whose files changed are built/deployed (paths-filter).
#     A frontend-only push skips the backend / ETL / worker builds, the SQL
#     migration, and the Neo4j step entirely.
#   • Docker layer caching (type=gha) makes every build incremental — npm ci /
#     next build / pip install are reused unless their inputs change.
#
# Deploy model (see docs/DEV_FLOW.md):
#   • Push to main → build (cached), run migrations (only if a migration file
#     changed), then deploy backend + frontend as NEW revisions at 0% TRAFFIC.
#     They do NOT serve users — test them on the per-revision URLs printed in the
#     job summary, then run the "Promote to production" workflow.
#
# IMPORTANT: migrations must stay backward-compatible (additive: CREATE/ADD,
# never DROP/RENAME in the same deploy) — the 0%-traffic revision shares the DB
# with the live one during the test window.
#
# Required GitHub secrets: AZURE_CREDENTIALS, ACR_LOGIN_SERVER, ACR_USERNAME,
# ACR_PASSWORD, AZURE_RESOURCE_GROUP, BACKEND_APP_NAME, FRONTEND_APP_NAME,
# ETL_APP_NAME, DATABASE_URL, NEO4J_URI, NEO4J_PASSWORD, PROD_API_URL,
# STAGING_API_URL.

name: Build & Deploy

on:
  push:
    branches: [main, staging]

env:
  ACR_REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  # ── Detect which areas changed ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
      etl: ${{ steps.f.outputs.etl }}
      worker: ${{ steps.f.outputs.worker }}
      migrations: ${{ steps.f.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            frontend:
              - 'frontend/**'
            etl:
              - 'etl/**'
            backend:
              - 'backend/**'
              - 'packages/connectors/**'
            worker:
              - 'worker/**'
              - 'packages/connectors/**'
            migrations:
              - 'backend/src/db/migrations/**'

  # ── Builds (each gated to its service; all layer-cached) ──────────────────
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-frontend:${{ github.ref_name }}-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref_name == 'main' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ./etl
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-etl:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-etl:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=etl
          cache-to: type=gha,mode=max,scope=etl

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-backend:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-backend:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/databridge-sync-worker:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/databridge-sync-worker:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ── SQL migrations (only when a migration file changed) ───────────────────
  migrate-sql:
    needs: [changes, build-backend]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run Knex migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:latest

  # ── Deploy changed services as 0%-traffic revisions ───────────────────────
  deploy:
    needs: [changes, build-frontend, build-etl, build-backend, build-worker, migrate-sql]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.etl == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - id: tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Backend + frontend land as NEW revisions at 0% traffic. We deliberately
      # do NOT shift traffic — the live revision keeps serving until you run the
      # "Promote to production" workflow. `revision set-mode multiple` is
      # idempotent and required for 0%-traffic revisions.
      - name: Deploy backend (staging revision, 0% traffic)
        if: needs.changes.outputs.backend == 'true'
        run: |
          az containerapp revision set-mode \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --mode multiple || true
          az containerapp update \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/databridge-backend:${{ steps.tag.outputs.tag }} \
            --revision-suffix ${{ steps.tag.outputs.tag }}
          FQDN=$(az containerapp revision list \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, '${{ steps.tag.outputs.tag }}')].properties.fqdn | [0]" -o tsv)
          {
            echo "### 🧪 Backend staging revision (0% traffic)";
            echo "API: \`https://$FQDN/api\` — test, then run **Promote to production**.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy frontend (staging revision, 0% traffic)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          az containerapp revision set-mode \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --mode multiple || true
          az containerapp update \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/databridge-frontend:${{ steps.tag.outputs.tag }} \
            --revision-suffix ${{ steps.tag.outputs.tag }}
          FQDN=$(az containerapp revision list \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, '${{ steps.tag.outputs.tag }}')].properties.fqdn | [0]" -o tsv)
          {
            echo "### 🧪 Frontend staging revision (0% traffic)";
            echo "Open: \`https://$FQDN\` — click through, then run **Promote to production**.";
          } >> "$GITHUB_STEP_SUMMARY"

      # ETL is internal plumbing (backend calls it) and stays auto-live on
      # deploy. Backward-compatible changes only (same rule as migrations).
      - name: Deploy ETL
        if: needs.changes.outputs.etl == 'true'
        run: |
          az containerapp update \
            --name ${{ secrets.ETL_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/databridge-etl:${{ steps.tag.outputs.tag }}

      # Sync-worker Job: no update step needed — the Job references
      # `databridge-sync-worker:<branch>-latest` and pulls the image fresh on
      # every execution, so the next sync uses the freshly-built worker image.

  # ── Neo4j constraints (only when backend changed; idempotent) ─────────────
  neo4j-constraints:
    needs: [changes, deploy]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Ensure Neo4j constraints
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: neo4j
        run: |
          node -e "
            require('ts-node/register');
            const { ensureNeo4jConstraints, closeDriver } = require('./src/db/neo4j');
            ensureNeo4jConstraints()
              .then(() => closeDriver())
              .then(() => { console.log('Neo4j constraints OK'); process.exit(0); })
              .catch(e => { console.error('Neo4j constraint error:', e.message); process.exit(1); });
          "
