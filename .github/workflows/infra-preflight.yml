# Infra preflight — READ-ONLY probe of what CI is actually allowed to do.
#
# Provisioning the jobs-worker without anyone touching a laptop depends on three
# unknowns. Guessing them and running a half-working apply against production is
# exactly the wrong move, so this workflow just looks and reports:
#
#   1. Which roles the deploy service principal holds. Creating a role
#      assignment needs "Owner" or "User Access Administrator" — plain
#      "Contributor" cannot, which would break any path that gives the new app
#      its own managed identity.
#   2. Whether the existing backend app's SECRET VALUES are readable. If they
#      are, a new app can be created with identical configuration without any
#      human re-entering passwords. Values are NEVER printed — only names and a
#      readable/not-readable verdict.
#   3. Whether Terraform state exists anywhere in the subscription. If it does
#      not, `terraform apply` must not be run at all: it would try to recreate
#      live infrastructure.
#
# Changes nothing. Safe to run at any time.

name: Infra preflight

on:
  push:
    branches: [main]
    paths:
      - '.ops/infra-preflight'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Probe
        env:
          APP: ${{ secrets.BACKEND_APP_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          set -uo pipefail   # deliberately NOT -e: a denied probe is a result

          # Write findings to BOTH the job summary and stdout: the summary is
          # nice in the web UI, but only stdout is retrievable via the logs API.
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          say "## Infra preflight"
          say ""

          # ── 1. Identity + roles ────────────────────────────────────────────
          CLIENT_ID=$(az account show --query user.name -o tsv 2>/dev/null || echo "")
          SUB_ID=$(az account show --query id -o tsv 2>/dev/null || echo "")
          say "### 1. Deploy identity"
          say "- client id: \`${CLIENT_ID:-unknown}\`"

          ROLES=$(az role assignment list --assignee "$CLIENT_ID" --all \
                    --query "[].roleDefinitionName" -o tsv 2>/dev/null | sort -u | tr '\n' ' ')
          if [ -z "$ROLES" ]; then
            say "- roles: **could not read** (the SP may lack directory read permission)"
          else
            say "- roles: \`$ROLES\`"
          fi

          if echo "$ROLES" | grep -qiE 'owner|user access administrator'; then
            say "- can create role assignments: **yes**"
          else
            say "- can create role assignments: **NO** — a new app cannot be granted its own permissions; it must reuse connection-string auth instead of a managed identity."
          fi

          # ── 2. Can we clone the backend app's configuration? ───────────────
          say ""
          say "### 2. Backend app configuration"

          ENV_COUNT=$(az containerapp show -n "$APP" -g "$RG" \
                        --query "length(properties.template.containers[0].env)" -o tsv 2>/dev/null || echo "")
          say "- env vars readable: \`${ENV_COUNT:-none}\`"

          # Names only. Values are never emitted.
          SECRET_NAMES=$(az containerapp secret list -n "$APP" -g "$RG" \
                           --query "[].name" -o tsv 2>/dev/null | tr '\n' ' ')
          say "- secret names: \`${SECRET_NAMES:-none}\`"

          # Probe readability of ONE value without revealing it: fetch it and
          # report only whether it came back non-empty.
          if az containerapp secret show -n "$APP" -g "$RG" --secret-name jwt-secret \
               --query value -o tsv >/dev/null 2>&1; then
            say "- secret VALUES readable: **yes** — a new app can be created with identical config, no human input needed"
          else
            say "- secret VALUES readable: **NO** — the secrets would have to be supplied another way"
          fi

          # ── 3. Terraform state ─────────────────────────────────────────────
          say ""
          say "### 3. Terraform state"
          TFSTATE_SA=$(az storage account list --query "[?contains(name,'tfstate')].name" -o tsv 2>/dev/null | tr '\n' ' ')
          if [ -n "$TFSTATE_SA" ]; then
            say "- state storage account found: \`$TFSTATE_SA\` — terraform may be usable"
          else
            say "- **no state storage account found** — Terraform state is local to someone's machine. Do NOT run \`terraform apply\` from CI; provision with \`az\` instead and reconcile Terraform later."
          fi

          # ── 4. Does the worker already exist? ─────────────────────────────
          say ""
          say "### 4. Current state"
          WORKER_APP="${APP%-backend}-jobs-worker"
          if az containerapp show -n "$WORKER_APP" -g "$RG" >/dev/null 2>&1; then
            say "- \`$WORKER_APP\`: **exists**"
          else
            say "- \`$WORKER_APP\`: does not exist yet"
          fi
          CUR_ROLE=$(az containerapp show -n "$APP" -g "$RG" \
                       --query "properties.template.containers[0].env[?name=='ROLE'].value | [0]" -o tsv 2>/dev/null || echo "")
          say "- backend ROLE: \`${CUR_ROLE:-<unset, runs API + workers>}\`"

          # Image + health of both apps. The worker inherits the backend's
          # TEMPLATE image at creation time, so if provisioning ran before the
          # matching backend build finished, the worker can be running code that
          # predates the queue-role support it depends on.
          B_IMG=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null | sed 's#.*/##')
          say "- backend image (template): \`${B_IMG:-unknown}\`"

          # The template is NOT what users hit. Deploys deliberately create the
          # new revision at 0% traffic, so the revision actually serving requests
          # can be an older build until it is promoted.
          LIVE_REV=$(az containerapp show -n "$APP" -g "$RG" \
                       --query "properties.configuration.ingress.traffic[?weight>\`0\`].revisionName | [0]" -o tsv 2>/dev/null || echo "")
          if [ -z "$LIVE_REV" ] || [ "$LIVE_REV" = "None" ]; then
            # A traffic entry with no name means "whatever is latest".
            LIVE_REV=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv 2>/dev/null || echo "")
          fi
          LIVE_IMG=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$LIVE_REV" \
                       --query "properties.template.containers[0].image" -o tsv 2>/dev/null | sed 's#.*/##')
          say "- backend revision serving traffic: \`${LIVE_REV:-unknown}\` running \`${LIVE_IMG:-unknown}\`"
          if [ -n "$LIVE_IMG" ] && [ "$LIVE_IMG" != "$B_IMG" ]; then
            say "- ⚠️ **not promoted** — users are on an older build than the template; the queue split is not in effect yet"
          fi
          B_Q=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env[?name=='WORKER_QUEUES'].value | [0]" -o tsv 2>/dev/null || echo "")
          say "- backend WORKER_QUEUES: \`${B_Q:-<unset = all>}\`"
          if az containerapp show -n "$WORKER_APP" -g "$RG" >/dev/null 2>&1; then
            W_IMG=$(az containerapp show -n "$WORKER_APP" -g "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null | sed 's#.*/##')
            W_RUN=$(az containerapp show -n "$WORKER_APP" -g "$RG" --query properties.runningStatus -o tsv 2>/dev/null || echo "")
            W_Q=$(az containerapp show -n "$WORKER_APP" -g "$RG" --query "properties.template.containers[0].env[?name=='WORKER_QUEUES'].value | [0]" -o tsv 2>/dev/null || echo "")
            say "- worker image: \`${W_IMG:-unknown}\`"
            say "- worker runningStatus: \`${W_RUN:-unknown}\`"
            say "- worker WORKER_QUEUES: \`${W_Q:-<unset = all>}\`"
            if [ "$B_IMG" != "$W_IMG" ]; then
              say "- ⚠️ **image mismatch** — worker is not on the same build as the backend"
            fi
          fi
          B_RUNNER=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env[?name=='DUCKDB_RUNNER'].value | [0]" -o tsv 2>/dev/null || echo "")
          say "- backend DUCKDB_RUNNER: \`${B_RUNNER:-<unset = in-process>}\`"

          # ── 5. Warehouse storage reality ───────────────────────────────────
          #
          # The per-tenant container flip was applied without validating the
          # WRITE path against real data, so the open question is factual: has a
          # `tenant-<id>` container actually been created, and did anything get
          # written into it? A container that exists but is EMPTY while its
          # tenant has synced is the signature of the failure mode to look for
          # (the read path is safe either way — stored URIs are absolute).
          #
          # Read-only: listing containers/blobs, never reading blob contents.
          say ""
          say "### 5. Warehouse storage"
          MODE=$(az containerapp show -n "$APP" -g "$RG" \
                   --query "properties.template.containers[0].env[?name=='WAREHOUSE_CONTAINER_MODE'].value | [0]" -o tsv 2>/dev/null || echo "")
          say "- backend WAREHOUSE_CONTAINER_MODE: \`${MODE:-<unset = shared>}\`"

          # Pick the warehouse account: the storage accounts in the RG minus any
          # terraform-state one. If that is ambiguous, say so instead of guessing.
          SA_LIST=$(az storage account list -g "$RG" --query "[?!contains(name,'tfstate')].name" -o tsv 2>/dev/null | tr '\n' ' ')
          SA_COUNT=$(echo "$SA_LIST" | wc -w | tr -d ' ')
          if [ "$SA_COUNT" != "1" ]; then
            say "- storage accounts in the group: \`${SA_LIST:-none}\` — cannot identify the warehouse account unambiguously, skipping container inspection"
          else
            SA=$(echo "$SA_LIST" | tr -d ' ')
            say "- storage account: \`$SA\`"
            # Contributor can read account keys even without a data-plane role.
            # Captured into a variable and never echoed.
            KEY=$(az storage account keys list -g "$RG" -n "$SA" --query "[0].value" -o tsv 2>/dev/null || echo "")
            if [ -z "$KEY" ]; then
              say "- ⚠️ could not read an account key — no data-plane access from this identity, skipping container inspection"
            else
              CONTAINERS=$(az storage container list --account-name "$SA" --account-key "$KEY" \
                             --auth-mode key --query "[].name" -o tsv 2>/dev/null || echo "")
              TENANT_CONTAINERS=$(echo "$CONTAINERS" | grep -E '^tenant-' || true)
              N_TENANT=$(echo "$TENANT_CONTAINERS" | grep -c . || true)
              say "- per-tenant containers: **${N_TENANT}**"
              if [ "$N_TENANT" = "0" ]; then
                if [ "$MODE" = "per-tenant" ]; then
                  say "- ⚠️ mode is \`per-tenant\` but no \`tenant-*\` container exists yet — no tenant has written since the flip. Expected until the first sync/transformation runs."
                fi
              else
                # Per container: is there anything in it? An empty container
                # means creation succeeded but no write landed.
                for C in $TENANT_CONTAINERS; do
                  FIRST=$(az storage blob list --container-name "$C" --account-name "$SA" --account-key "$KEY" \
                            --auth-mode key --num-results 1 --query "[0].name" -o tsv 2>/dev/null || echo "")
                  if [ -n "$FIRST" ] && [ "$FIRST" != "None" ]; then
                    say "  - \`$C\`: has data (e.g. \`$FIRST\`) — the per-tenant WRITE path works for this tenant ✅"
                  else
                    say "  - \`$C\`: **empty** — container created but nothing written yet"
                  fi
                done
              fi
              if echo "$CONTAINERS" | grep -qx 'warehouse'; then
                say "- legacy shared \`warehouse\` container still present (expected — existing data reads from absolute URIs; Fase 4 migrates it)"
              fi
            fi
          fi

          echo "Preflight complete."
