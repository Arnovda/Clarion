# Promote to production — manual traffic shift.
#
# `deploy.yml` lands new backend + frontend code as 0%-traffic revisions on
# every push to main (staging). Once you've tested those revisions' URLs (see
# the deploy job summary), run this workflow to shift 100% of user traffic to
# the latest revision — that's the moment it goes live.
#
# Run it from the GitHub Actions tab → "Promote to production" → Run workflow,
# OR — the GitOps path, since workflow_dispatch is 403 for the repo's
# integration token — edit `.ops/promote` on main (see .ops/README.md). The
# first non-comment line of that file is the target; a re-apply is a comment
# edit documenting what is being promoted.
#
# SAME LESSON as the container-mode control: touch `.ops/promote` only AFTER
# deploy.yml has finished building. This workflow promotes whatever revision
# is READY right now — if the build hasn't created the new revision yet, the
# previous one is what goes live, silently.
#
# Reuses the same secrets as deploy.yml (AZURE_CREDENTIALS, *_APP_NAME,
# AZURE_RESOURCE_GROUP).

name: Promote to production

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which apps to promote to 100% traffic'
        type: choice
        default: 'backend + frontend'
        options:
          - 'backend + frontend'
          - 'backend only'
          - 'frontend only'
  push:
    branches: [main]
    paths:
      - '.ops/promote'

concurrency: promote-production

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve promote target
        id: target
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            # Push-triggered: read the target from the control file. Comment
            # lines let a re-apply document itself, same as the other .ops
            # controls.
            TARGET=$(grep -v '^[[:space:]]*#' .ops/promote | grep -v '^[[:space:]]*$' | head -1 | xargs)
          fi
          case "$TARGET" in
            "backend + frontend"|"backend only"|"frontend only") ;;
            *)
              echo "::error::.ops/promote must name one of: 'backend + frontend', 'backend only', 'frontend only' (got '$TARGET')"
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Shift traffic to the latest revision
        run: |
          set -euo pipefail
          # IMPORTANT: promote BY REVISION NAME, never with `latest=100`.
          # A traffic entry pinned to "latest" auto-follows every future
          # revision, which would make the NEXT push go live immediately and
          # silently break the test-first deploy model.
          #
          # The whole thing RETRIES, and re-resolves the revision on every
          # attempt. Azure locks a container app while a deploy provisions a
          # revision, so promoting straight after a push fails with
          # ContainerAppOperationInProgress. Retrying only the traffic call
          # would fix the crash but not the real hazard: while that deploy is
          # in flight its revision is not "ready" yet, so we would have
          # resolved — and then promoted — the PREVIOUS revision, silently
          # shipping something older than the commit you meant to ship.
          # Re-resolving each round means the wait lands on the new revision.
          promote() {
            local app="$1" attempt rev out
            for attempt in $(seq 1 15); do
              rev=$(az containerapp show \
                --name "$app" \
                --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                --query properties.latestReadyRevisionName -o tsv)
              if [ -z "$rev" ]; then
                echo "::error::No ready revision found for $app — nothing to promote."
                return 1
              fi
              echo "Promoting $app → $rev=100 (attempt $attempt)…"
              if out=$(az containerapp ingress traffic set \
                --name "$app" \
                --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                --revision-weight "$rev=100" 2>&1); then
                echo "$app now serves $rev"
                echo "- \`$app\` → \`$rev\`" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              if ! grep -q 'ContainerAppOperationInProgress' <<<"$out"; then
                echo "$out" >&2
                echo "::error::Could not promote $app."
                return 1
              fi
              echo "  a deploy is still provisioning $app — waiting 20s, then re-checking which revision is ready…"
              sleep 20
            done
            echo "::error::$app was busy for 5 minutes. A deploy may be stuck — check the Build & Deploy runs, then re-run this."
            return 1
          }
          # Name the revisions that actually went live. "the latest revision"
          # is not something you can check afterwards against what you meant
          # to ship; a revision name is.
          echo "### ✅ Promoted to production" >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.target.outputs.target }}" in
            "backend only")  promote "${{ secrets.BACKEND_APP_NAME }}" ;;
            "frontend only") promote "${{ secrets.FRONTEND_APP_NAME }}" ;;
            *)               promote "${{ secrets.BACKEND_APP_NAME }}"; promote "${{ secrets.FRONTEND_APP_NAME }}" ;;
          esac

          # ── The half of "release" that does NOT happen here ────────────────
          # Promoting shifts TRAFFIC, and one revision serves every tenant —
          # there is no such thing as promoting to some customers and not
          # others. Choosing WHO sees a new feature is the flag, and it is a
          # different act: instant, needing no deploy, and reversible with one
          # click where this is reversible only by another traffic shift.
          #
          # This link exists because those two acts are ONE decision in the
          # operator's head. Without it, promoting ends on a green tick in
          # GitHub and the audience choice is somewhere else entirely — so a
          # feature reaches production and then sits switched off because
          # nothing said it was waiting. The customer list cannot live on this
          # page: a workflow_dispatch form is a static list in this file, so
          # rendering real customer names here would mean editing this
          # workflow every time one is onboarded.
          FRONTEND_FQDN=$(az containerapp show \
            --name "${{ secrets.FRONTEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || true)
          {
            echo ""
            echo "### Now choose who sees it"
            echo ""
            echo "The new code is live for every tenant, but anything behind a feature flag is still switched OFF until you say otherwise."
            if [ -n "$FRONTEND_FQDN" ]; then
              echo ""
              echo "**[Open \"Who sees what\" →](https://$FRONTEND_FQDN/admin/features)** — tick the customers who should get each new feature, or Everyone."
            else
              echo ""
              echo "Open **Settings → Who sees what** in Clarion and tick the customers who should get each new feature."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
