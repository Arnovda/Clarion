# Postgres pool ceilings — GitOps control for KNEX_POOL_MAX on both apps.
#
#   .ops/db-pool   contains   `backend <n>`  and  `worker <n>`  lines
#
# Why a control and not Terraform alone: no workflow runs terraform, so an
# env var that lives only in main.tf never reaches the running apps (the
# standing lesson of every .ops control). Same shape as
# duckdb-lockdown-mode.yml — no-op when already applied, never a promote
# vehicle, rollback is an edit of the same file.

name: Postgres pool ceilings

on:
  push:
    branches: [main]
    paths:
      - '.ops/db-pool'
  workflow_dispatch:

# Its OWN concurrency group, on purpose. Run #1 shared deploy.yml's group
# and was CANCELLED one second in: a group holds ONE pending run, and the
# deploy triggered by the same push took the slot. Two workflows fired by
# one push must never share a group. The collision the shared group was
# meant to avoid (two `az containerapp update`s on one app) is handled
# below by waiting for Build & Deploy to be idle before touching the app.
concurrency:
  group: db-pool
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read desired ceilings
        id: want
        run: |
          set -euo pipefail
          B=$(grep -vE '^[[:space:]]*(#|$)' .ops/db-pool | awk '$1=="backend"{print $2; exit}')
          W=$(grep -vE '^[[:space:]]*(#|$)' .ops/db-pool | awk '$1=="worker"{print $2; exit}')
          for v in "$B" "$W"; do
            if ! echo "$v" | grep -qE '^[1-9][0-9]?$'; then echo "::error::.ops/db-pool needs 'backend <1-99>' and 'worker <1-99>' (got backend='$B' worker='$W')"; exit 1; fi
          done
          echo "backend=$B" >> "$GITHUB_OUTPUT"
          echo "worker=$W" >> "$GITHUB_OUTPUT"
          echo "Desired KNEX_POOL_MAX: backend=$B worker=$W"

      - name: Wait for Build & Deploy to be idle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # deploy.yml's promote and this control both run `az containerapp
          # update` and both shift traffic; interleaving them can leave the
          # LIVE revision without the value this control just applied while
          # the template (what we read back) carries it. So: wait, up to
          # 30 minutes, until no deploy run is queued or in progress.
          for i in $(seq 1 90); do
            BUSY=0
            for st in in_progress queued pending waiting requested; do
              N=$(gh run list --workflow deploy.yml --status "$st" --json databaseId --jq 'length' 2>/dev/null || echo 0)
              BUSY=$((BUSY + N))
            done
            if [ "$BUSY" = "0" ]; then
              echo "No Build & Deploy run in flight."; exit 0
            fi
            echo "Build & Deploy in flight — waiting ($i/90)…"; sleep 20
          done
          echo "::error::Build & Deploy still running after 30 minutes; re-push .ops/db-pool later"; exit 1

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apply
        env:
          APP: ${{ secrets.BACKEND_APP_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          B: ${{ steps.want.outputs.backend }}
          W: ${{ steps.want.outputs.worker }}
        run: |
          set -euo pipefail
          say() { printf '%s\n' "$1"; printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          WORKER="${APP%-backend}-jobs-worker"
          Q="properties.template.containers[0].env[?name=='KNEX_POOL_MAX'].value | [0]"
          say "## Postgres pool ceilings"
          say ""

          # ── jobs-worker: no ingress, single revision — an update is a restart.
          if az containerapp show -n "$WORKER" -g "$RG" >/dev/null 2>&1; then
            CUR_W=$(az containerapp show -n "$WORKER" -g "$RG" --query "$Q" -o tsv 2>/dev/null || true)
            if [ "$CUR_W" = "$W" ]; then
              say "- worker: already \`$W\` — nothing to do"
            else
              az containerapp update -n "$WORKER" -g "$RG" --set-env-vars KNEX_POOL_MAX="$W" >/dev/null
              say "- worker: \`${CUR_W:-<unset>}\` → \`$W\` (restarted)"
            fi
          else
            say "- worker: app \`$WORKER\` not found — skipped (provision it with .ops/provision-jobs-worker; the provision workflow sets KNEX_POOL_MAX itself)"
          fi

          # ── backend: new revision at 0% traffic, wait, health-check, shift.
          CUR_B=$(az containerapp show -n "$APP" -g "$RG" --query "$Q" -o tsv 2>/dev/null || true)
          if [ "$CUR_B" = "$B" ]; then
            say "- backend: already \`$B\` — no revision created, no traffic shifted"
            exit 0
          fi
          az containerapp revision set-mode -n "$APP" -g "$RG" --mode multiple || true
          NEW_REV=$(az containerapp update -n "$APP" -g "$RG" --set-env-vars KNEX_POOL_MAX="$B" --query properties.latestRevisionName -o tsv)
          for _ in $(seq 1 30); do
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NEW_REV" --query properties.provisioningState -o tsv 2>/dev/null || echo "")
            case "$STATE" in Provisioned) break ;; Failed|Degraded) echo "::error::revision $NEW_REV $STATE"; exit 1 ;; esac
            sleep 10
          done
          [ "$STATE" = "Provisioned" ] || { echo "::error::revision $NEW_REV not provisioned in time"; exit 1; }
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$NEW_REV=100"
          APPLIED=$(az containerapp show -n "$APP" -g "$RG" --query "$Q" -o tsv)
          say "- backend: \`${CUR_B:-<unset>}\` → \`$APPLIED\` (revision \`$NEW_REV\` at 100%)"
          test "$APPLIED" = "$B"
