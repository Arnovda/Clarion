# Claude model per role — GitOps control for CLAUDE_MODEL / CLAUDE_MODEL_HAIKU.
#
#   .ops/claude-model   contains   `main <id>`  and  `light <id>`  lines
#
# Why a control and not Terraform alone: no workflow runs terraform, so an
# env var that lives only in main.tf never reaches the running apps (the
# standing lesson of every .ops control). Cloned from db-pool.yml — no-op
# when already applied, never a promote vehicle, rollback is an edit of the
# same file.

name: Claude model

on:
  push:
    branches: [main]
    paths:
      - '.ops/claude-model'
  workflow_dispatch:

# Its OWN group (see db-pool.yml: two workflows fired by one push must never
# share one). The collision with deploy.yml is handled by waiting below.
concurrency:
  group: claude-model
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read desired models
        id: want
        run: |
          set -euo pipefail
          M=$(grep -vE '^[[:space:]]*(#|$)' .ops/claude-model | awk '$1=="main"{print $2; exit}')
          L=$(grep -vE '^[[:space:]]*(#|$)' .ops/claude-model | awk '$1=="light"{print $2; exit}')
          for v in "$M" "$L"; do
            if ! echo "$v" | grep -qE '^claude-[a-z0-9-]+$'; then echo "::error::.ops/claude-model needs 'main claude-…' and 'light claude-…' (got main='$M' light='$L')"; exit 1; fi
          done
          echo "main=$M" >> "$GITHUB_OUTPUT"
          echo "light=$L" >> "$GITHUB_OUTPUT"
          echo "Desired: CLAUDE_MODEL=$M CLAUDE_MODEL_HAIKU=$L"

      - name: Wait for this commit's Build & Deploy to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # deploy.yml runs on EVERY push to main, so the push that edits
          # .ops/claude-model always has a Build & Deploy run of its own.
          # Wait for THAT run — not merely for "nothing in flight": both
          # workflows start on the same push and this one can look before
          # the deploy has even been queued. Switching models ahead of the
          # code that can shape requests for them breaks every AI call (see
          # the ROLLBACK note in .ops/claude-model), so anything but success
          # stops here.
          CONC=""
          for i in $(seq 1 120); do
            ROW=$(gh run list --workflow deploy.yml --commit "$SHA" --limit 1 --json status,conclusion \
                    --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "")
            ST=${ROW%% *}; CONC=${ROW#* }
            if [ "$ST" = "completed" ]; then break; fi
            echo "Build & Deploy for $SHA: ${ROW:-not queued yet} — waiting ($i/120)…"; sleep 15
          done
          if [ "${ST:-}" != "completed" ]; then
            echo "::error::Build & Deploy for $SHA did not finish within 30 minutes; re-push .ops/claude-model once it has"; exit 1
          fi
          if [ "$CONC" != "success" ]; then
            echo "::error::Build & Deploy for $SHA concluded '$CONC' — not switching models ahead of the code that supports them"; exit 1
          fi
          # Then make sure nothing ELSE is mid-promote on the same apps.
          for i in $(seq 1 60); do
            BUSY=0
            for st in in_progress queued pending waiting requested; do
              N=$(gh run list --workflow deploy.yml --status "$st" --json databaseId --jq 'length' 2>/dev/null || echo 0)
              BUSY=$((BUSY + N))
            done
            [ "$BUSY" = "0" ] && break
            echo "Another Build & Deploy in flight — waiting ($i/60)…"; sleep 20
          done
          [ "$BUSY" = "0" ] || { echo "::error::Build & Deploy still busy; re-push .ops/claude-model later"; exit 1; }
          echo "This commit's Build & Deploy succeeded; nothing in flight."

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apply
        env:
          APP: ${{ secrets.BACKEND_APP_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          M: ${{ steps.want.outputs.main }}
          L: ${{ steps.want.outputs.light }}
        run: |
          set -euo pipefail
          say() { printf '%s\n' "$1"; printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          WORKER="${APP%-backend}-jobs-worker"
          QM="properties.template.containers[0].env[?name=='CLAUDE_MODEL'].value | [0]"
          QL="properties.template.containers[0].env[?name=='CLAUDE_MODEL_HAIKU'].value | [0]"
          say "## Claude model"
          say ""

          # ── jobs-worker: no ingress, single revision — an update is a restart.
          if az containerapp show -n "$WORKER" -g "$RG" >/dev/null 2>&1; then
            CUR_WM=$(az containerapp show -n "$WORKER" -g "$RG" --query "$QM" -o tsv 2>/dev/null || true)
            CUR_WL=$(az containerapp show -n "$WORKER" -g "$RG" --query "$QL" -o tsv 2>/dev/null || true)
            if [ "$CUR_WM" = "$M" ] && [ "$CUR_WL" = "$L" ]; then
              say "- worker: already \`$M\` / \`$L\` — nothing to do"
            else
              az containerapp update -n "$WORKER" -g "$RG" --set-env-vars CLAUDE_MODEL="$M" CLAUDE_MODEL_HAIKU="$L" >/dev/null
              say "- worker: \`${CUR_WM:-<unset>}\` / \`${CUR_WL:-<unset>}\` → \`$M\` / \`$L\` (restarted)"
            fi
          else
            say "- worker: app \`$WORKER\` not found — skipped"
          fi

          # ── backend: new revision, wait, shift.
          CUR_M=$(az containerapp show -n "$APP" -g "$RG" --query "$QM" -o tsv 2>/dev/null || true)
          CUR_L=$(az containerapp show -n "$APP" -g "$RG" --query "$QL" -o tsv 2>/dev/null || true)
          if [ "$CUR_M" = "$M" ] && [ "$CUR_L" = "$L" ]; then
            say "- backend: already \`$M\` / \`$L\` — no revision created, no traffic shifted"
            exit 0
          fi
          az containerapp revision set-mode -n "$APP" -g "$RG" --mode multiple || true
          NEW_REV=$(az containerapp update -n "$APP" -g "$RG" --set-env-vars CLAUDE_MODEL="$M" CLAUDE_MODEL_HAIKU="$L" --query properties.latestRevisionName -o tsv)
          for _ in $(seq 1 30); do
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NEW_REV" --query properties.provisioningState -o tsv 2>/dev/null || echo "")
            case "$STATE" in Provisioned) break ;; Failed|Degraded) echo "::error::revision $NEW_REV $STATE"; exit 1 ;; esac
            sleep 10
          done
          [ "$STATE" = "Provisioned" ] || { echo "::error::revision $NEW_REV not provisioned in time"; exit 1; }
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$NEW_REV=100"
          AM=$(az containerapp show -n "$APP" -g "$RG" --query "$QM" -o tsv)
          AL=$(az containerapp show -n "$APP" -g "$RG" --query "$QL" -o tsv)
          say "- backend: \`${CUR_M:-<unset>}\` / \`${CUR_L:-<unset>}\` → \`$AM\` / \`$AL\` (revision \`$NEW_REV\` at 100%)"
          test "$AM" = "$M" && test "$AL" = "$L"
